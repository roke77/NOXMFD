<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — ENG</title>
<!--
  The ENG page (id avn, served at /avn; one of the Avionics hub's pages, docs/eng-page.md): one
  card per engine (RPM and thrust/power dials, health tape, status), a centre pedestal with the
  throttle lever and IR heat tape, and a fuel band (fuel dial, per-tank bars, burn / endurance /
  range). Both layouts; a pure reactive renderer fed by the shell over postMessage. The system
  toggles and airframe status live on the SYS page (id afm, src/web/pages/afm/).

  .avn-content is one flex column that avn.js places in whatever vertical band
  avnContentVerticalExtent names (full: the shell-forwarded geom.frameTop/frameHeight; compact: a
  small top/bottom margin) at the full panel width.

  Shell -> page messages (all {mfd:true, ...}):
    'avn'        : { name, fuel, throttle, heat, heatColor, rpm, hasAb, abStart, eng, metric } —
                   the live snapshot. `name` is presence-only (drives the NO DATA empty state).
                   `eng` is the plugin's ENG block: { fuelKg, fuelCapKg, burn, gs, engines[],
                   tanks[] } (TelemetryJson.EngBlock).
    'avn-layout' : full view only: layout:'full' + geom {frameTop, frameHeight}, the vertical band
                   .avn-content fills. Without it (split panes, outside a shell) the page uses its
                   compact profile, a fixed margin.
    'orient'     : app-wide orientation (drives body.portrait/.landscape).
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/avn/avn.css">
</head>
<body>
  <div class="avn-panel" id="avn-panel">
    <div class="avn-empty mfd-empty" id="avn-empty"><span class="mfd-empty-title">ENG</span>&mdash; NO DATA &mdash;</div>
    <!-- Shared tick ring for every dial (fuel + each engine card's two). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="avn-gauge-ticks">
          <line class="avn-gauge-tick major" x1="23.13" y1="23.13" x2="28.08" y2="28.08"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="13.86" x2="39.49" y2="17.66"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="12.47" x2="55.32" y2="16.42"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="19.26" x2="69.98" y2="22.49"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="32.75" x2="80.29" y2="34.56"/>
          <line class="avn-gauge-tick major" x1="88"    y1="50"    x2="81"    y2="50"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="67.25" x2="80.29" y2="65.44"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="80.74" x2="69.98" y2="77.51"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="87.53" x2="55.32" y2="83.58"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="86.14" x2="39.49" y2="82.34"/>
          <line class="avn-gauge-tick major" x1="23.13" y1="76.87" x2="28.08" y2="71.92"/>
        </g>
      </defs>
    </svg>

    <div class="avn-content" id="avn-content">
      <!-- Engine cards (from #avn-engine-tpl) split into the two side grids by avn.js. -->
      <div class="avn-top" id="avn-top">
        <div class="avn-side" id="avn-side-l"></div>
        <div class="avn-pedestal" id="avn-pedestal">
          <div class="avn-ped-heads"><span>THRL</span><span>HEAT</span></div>
          <div class="avn-ped-instruments">
            <div class="avn-lever" id="avn-lever" role="img" aria-label="Throttle">
              <div class="avn-lever-ab" id="avn-lever-ab"></div>
              <div class="avn-lever-slot"></div>
              <div class="avn-lever-fill"></div>
              <div class="avn-lever-detent" id="avn-lever-detent"></div>
              <div class="avn-lever-idle"></div>
              <span class="avn-lever-tag ab" id="avn-lever-tag-ab">AB</span>
              <span class="avn-lever-tag mil" id="avn-lever-tag-mil">MIL</span>
              <span class="avn-lever-tag idle">IDLE</span>
              <div class="avn-lever-handle" id="avn-lever-handle"><i></i><i></i><i></i></div>
            </div>
            <div class="avn-heat" id="avn-heat" role="img" aria-label="IR heat signature">
              <div class="avn-heat-tape">
                <div class="avn-heat-scale"></div>
                <div class="avn-heat-lit" id="avn-heat-lit"></div>
                <div class="avn-heat-pointer" id="avn-heat-pointer"></div>
                <div class="avn-heat-tick" style="top:25%"></div>
                <div class="avn-heat-tick major" style="top:50%"></div>
                <div class="avn-heat-tick" style="top:75%"></div>
              </div>
            </div>
          </div>
          <div class="avn-ped-reads">
            <div><span class="avn-ped-val" id="avn-thr-val">--</span><span class="avn-ped-sub" id="avn-thr-zone"></span></div>
            <div><span class="avn-ped-val" id="avn-heat-val">--</span><span class="avn-ped-sub">IR</span></div>
          </div>
        </div>
        <div class="avn-side" id="avn-side-r"></div>
      </div>

      <div class="avn-fuel">
        <div class="avn-gauge fuel" id="avn-gauge-fuel">
          <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
            <path class="avn-gauge-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
            <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
            <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
            <use href="#avn-gauge-ticks"/>
            <g class="avn-gauge-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
            <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
          </svg><div class="avn-gauge-label">FUEL</div><div class="avn-gauge-val">&mdash;</div>
          <div class="avn-gauge-sub" id="avn-fuel-mass"></div></div>
        </div>
        <div class="avn-tanks" id="avn-tanks"></div>
        <div class="avn-reads">
          <div class="avn-read"><span class="avn-read-label">BURN</span><span class="avn-read-val"><span id="avn-burn">--</span> <small id="avn-burn-unit"></small></span></div>
          <div class="avn-read"><span class="avn-read-label">ENDURANCE</span><span class="avn-read-val"><span id="avn-endur">--:--</span> <small>h:mm</small></span></div>
          <div class="avn-read"><span class="avn-read-label">RANGE</span><span class="avn-read-val"><span id="avn-range">--</span> <small id="avn-range-unit"></small></span><span class="avn-read-sub" id="avn-gs"></span></div>
        </div>
      </div>
    </div>
  </div>

  <template id="avn-engine-tpl">
    <div class="avn-engine">
      <div class="avn-engine-head"><span class="avn-engine-name"></span><span class="avn-chip"></span></div>
      <div class="avn-engine-body">
        <div class="avn-hp">
          <span class="avn-hp-label">HP</span>
          <div class="avn-hp-tape"><div class="avn-hp-fill"></div></div>
          <span class="avn-hp-val">--</span>
        </div>
        <div class="avn-engine-dials">
          <div class="avn-gauge rpm" role="img">
            <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
              <path class="avn-gauge-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
              <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
              <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
              <use href="#avn-gauge-ticks"/>
              <g class="avn-gauge-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
              <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
            </svg><div class="avn-gauge-label">RPM</div><div class="avn-gauge-val">&mdash;</div></div>
          </div>
          <div class="avn-gauge out" role="img">
            <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
              <path class="avn-gauge-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
              <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
              <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
              <use href="#avn-gauge-ticks"/>
              <g class="avn-gauge-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
              <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
            </svg><div class="avn-gauge-label">THR</div><div class="avn-gauge-val">&mdash;</div></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="avn-tank-tpl">
    <div class="avn-tank">
      <span class="avn-tank-name"></span>
      <div class="avn-tank-bar"><div class="avn-tank-fill"></div></div>
      <span class="avn-tank-kg"></span>
      <span class="avn-chip avn-tank-flag"></span>
    </div>
  </template>

<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/avn/avn-throttle-policy.js"></script>
<script src="/assets/pages/avn/avn-eng-policy.js"></script>
<script src="/assets/pages/avn/avn.js"></script>
</body>
</html>
