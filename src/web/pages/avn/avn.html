<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — AVN</title>
<!-- ?nochrome — the host already shows this aircraft's own-ship readouts, so don't repeat them:
     the FUEL/RPM/HEAT/THRL gauges and the status tiles go. The F-35 sets it because its master strip
     carries both; the bezel doesn't, and renders exactly as before.

     FIXME: this used to leave the damage silhouette the whole panel — the actual reason nochrome
     existed. That silhouette is gone (this page is avionics-only now); a nochrome AVN portal on
     the F-35 currently renders an empty panel. F-35 is out of scope for this pass (docs/layouts.md)
     so left as-is rather than guessed at — worth a decision (drop nochrome's effect on this page
     entirely? show something else?) whenever F-35 work picks this back up.

     Read here, inline and before the body, rather than posted in by the host: this decides what to
     paint, and a message arriving after first paint would flash the gauges up and then pull them —
     on every mount, and a portal glass mounts pages constantly. It costs the page nothing when
     absent. -->
<script>
  if (new URLSearchParams(location.search).has('nochrome')) document.documentElement.classList.add('nochrome');
</script>
<!--
  Bare AVN page served at /avn. Single source of truth for the avionics page (the 8 avn.toggle
  status tiles + FUEL/RPM/HEAT/THRL gauges) in BOTH layouts — a pure reactive renderer fed by the
  shell over postMessage. No damage silhouette or airframe name here any more — both moved out (the
  ticket's future AFM page owns airframe status; this page is avionics only).

  The 8 status tiles (2 rows x 4 cols, .avn-icon-grid) and the 4 gauges (2x2, .avn-gauge-grid) are
  plain CSS grids — no per-tile geometry from the shell any more, in either profile. Both grids are
  stacked as siblings inside one flex column (.avn-content), which centres itself vertically within
  whatever band avn.js's avnContentVerticalExtent names (full: the shell-forwarded
  geom.frameTop/frameHeight — still "below the top bezel row", nothing to do with the silhouette
  that used to sit there; compact: a small top/bottom margin) and spans the full panel width.
  Clicking a status tile does nothing here — toggling still only happens via the shell's
  physical-key `avn.toggle` wiring (full view: mfd.js placeAvnNavLabels also draws a shell-side NAV
  label at each of those 8 keys now, so the bezel key itself shows what it does; split pane:
  wireAvnPaneToggleKeys — only 4 keys exist in a pane, so this page shows only THOSE 4 tiles too
  (avnData.visible) with a PAGE x/y indicator, rather than showing all 8 as if every one were live).
  Full view always shows all 8 — it has a dedicated key for each, so it never paginates.

  Shell -> page messages (all {mfd:true, ...}):
    'avn'        : { name, fuel, throttle, heat, rpm, gearDown, radar, guns, …, visible, page, pages }
                   — the live snapshot. `name` is presence-only now (drives the NO DATA empty
                   state), never displayed. `visible`/`page`/`pages` (compact/split only — full view
                   never sends them) name the pane's current 4-of-8 page; their absence means "show
                   all 8, no indicator" (full view, or loaded outside a shell).
    'avn-layout' : geometry. layout:'full' + geom {frameTop, frameHeight} (just the vertical band
                   .avn-content centres in — no more per-tile leftSlots/rightSlots). layout:'compact'
                   carries no geometry at all any more; the compact vertical band is a fixed margin.
    'orient'     : app-wide orientation (drives body.portrait/.landscape).
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/avn/avn.css">
</head>
<body>
  <div class="avn-panel" id="avn-panel">
    <div class="avn-empty mfd-empty" id="avn-empty"><span class="mfd-empty-title">AVN</span>&mdash; NO DATA &mdash;</div>
    <!-- Shared tick ring for every gauge dial below (avn.html's <use> pattern) — lives outside
         .avn-content since <defs>/<use> just need matching ids anywhere in the document. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="avn-gauge-ticks">
          <line class="avn-gauge-tick major" x1="23.13" y1="23.13" x2="28.08" y2="28.08"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="13.86" x2="39.49" y2="17.66"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="12.47" x2="55.32" y2="16.42"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="19.26" x2="69.98" y2="22.49"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="32.75" x2="80.29" y2="34.56"/>
          <line class="avn-gauge-tick major" x1="88"    y1="50"    x2="81"    y2="50"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="67.25" x2="80.29" y2="65.44"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="80.74" x2="69.98" y2="77.51"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="87.53" x2="55.32" y2="83.58"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="86.14" x2="39.49" y2="82.34"/>
          <line class="avn-gauge-tick major" x1="23.13" y1="76.87" x2="28.08" y2="71.92"/>
        </g>
      </defs>
    </svg>
    <!-- Content: the 2-row x 4-col status-icon grid, then the 2x2 gauge grid below it — both
         siblings in one flex column (.avn-content) that centres itself vertically as a unit and
         spans the full panel width. Replaces the old two-side-column tile layout (tiles anchored
         to bezel-key positions) — that anchoring moved to the shell itself: CLASSIC's full view now
         draws its own NAV labels at those 8 keys (mfd.js placeAvnNavLabels), so this page no longer
         needs per-tile geometry from the shell at all, in either profile. Each tile is a label +
         icon; bright = active (GEAR DOWN is red, RADAR/GUNS on are green), dim gray = off. State
         classes ('on' / 'off' / 'gear-down') come from avn-status-policy.js. Icons use
         stroke="currentColor" so one color rule drives both label and glyph. -->
    <div class="avn-content" id="avn-content">
    <div class="avn-icon-grid" id="avn-icon-grid">
      <div class="avn-tile off" id="avn-tile-gear">
        <span class="avn-tile-label">GEAR</span>
        <!-- Recolourable mask of the real in-game gear glyph, captured once from the game and baked
             as gear-icon.png (--gear-mask in avn.css). Served by both the plugin and serve_web. -->
        <div class="avn-tile-icon-wrap"><div class="avn-tile-icon avn-mask-icon" id="avn-gear-icon"></div></div>
      </div>
      <div class="avn-tile off" id="avn-tile-radar">
        <span class="avn-tile-label">RADAR</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 9.6a11 11 0 0 1 15 0"/><path d="M7.5 12.6a6.5 6.5 0 0 1 9 0"/>
          <circle cx="12" cy="16.1" r="1.3" fill="currentColor" stroke="none"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-guns">
        <span class="avn-tile-label">GUNS</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h6"/><path d="M10.5 8H8a4 4 0 0 0 0 8h2.5"/><path d="M13.5 8H16a4 4 0 0 1 0 8h-2.5"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-eng">
        <span class="avn-tile-label">ENG</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10v6"/><path d="M12 5v3"/><path d="M10 5h4"/><path d="M5 13h-2"/><path d="M6 10h2l2 -2h3.382a1 1 0 0 1 .894 .553l1.448 2.894a1 1 0 0 0 .894 .553h1.382v-2h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2v-2h-3v2a1 1 0 0 1 -1 1h-3.465a1 1 0 0 1 -.832 -.445l-1.703 -2.555h-2v-6"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-assist">
        <span class="avn-tile-label">ASSIST</span>
        <!-- Flight Path Vector / Flight Path Marker: the circle-plus-wings symbol showing where the
             aircraft is actually going (velocity vector), not where the nose points. Wings and the
             top tick are gapped from the circle, matching the real HUD symbol. -->
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.5"/>
          <line x1="12" y1="2" x2="12" y2="8.5"/>
          <line x1="2.5" y1="12" x2="7.5" y2="12"/>
          <line x1="16.5" y1="12" x2="21.5" y2="12"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-nvg">
        <span class="avn-tile-label">NVG</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 12s3.4-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.4 6.5-9.5 6.5-9.5-6.5-9.5-6.5z"/><circle cx="12" cy="12" r="3"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-lights">
        <span class="avn-tile-label">LIGHTS</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2"/><path d="M12 18.8v2"/><path d="M3.2 12h2"/><path d="M18.8 12h2"/><path d="M5.5 5.5l1.6 1.6"/><path d="M16.9 16.9l1.6 1.6"/><path d="M18.5 5.5l-1.6 1.6"/><path d="M7.1 16.9l-1.6 1.6"/>
        </svg></div>
      </div>
      <div class="avn-tile off" id="avn-tile-turret">
        <span class="avn-tile-label">TURRET</span>
        <div class="avn-tile-icon-wrap"><svg class="avn-tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 13 L4 18.5 H20 L16.5 13"/><path d="M8 13 V11 Q8 8 12 8 Q16 8 16 11 V13"/><path d="M8 10.8 H3 V12.8 H8"/>
        </svg></div>
      </div>
    </div>
    <div class="avn-gauge-grid" id="avn-gauge-grid">
      <div class="avn-gauge fuel" id="avn-gauge-fuel">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-fuel-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <!-- Needle is a thin triangle (base at the hub, offset ±1.2 perpendicular to the
               50,50->30.2,30.2 shaft) instead of a stroked line, so the tip comes to a point rather
               than a round/flat cap; the hub circle below covers the base regardless of how exactly
               it's cut. Same points on all 4 dials — the shaft is identical everywhere. -->
          <g class="avn-gauge-needle" id="avn-gauge-fuel-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">FUEL</div><div class="avn-gauge-val" id="avn-gauge-fuel-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge heat" id="avn-gauge-heat">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-heat-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <g class="avn-gauge-needle" id="avn-gauge-heat-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">HEAT</div><div class="avn-gauge-val" id="avn-gauge-heat-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge rpm" id="avn-gauge-rpm">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-rpm-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <g class="avn-gauge-needle" id="avn-gauge-rpm-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">RPM</div><div class="avn-gauge-val" id="avn-gauge-rpm-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge thr" id="avn-gauge-thr">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <!-- fill-hot paints BELOW fill (source order = paint order): it's always drawn full-extent
               to the live throttle value, and fill (green, capped at abStart) paints over it, masking
               red for the MIL portion — the visible red segment is whatever fill doesn't cover. Both
               use the exact same fixed-dasharray reveal as every other gauge (avn.js setAvnGaugeFill),
               so the red segment's leading edge tracks the throttle continuously instead of a
               recomputed [start,end] dash pattern jumping every frame. -->
          <path class="avn-gauge-fill-hot" id="avn-gauge-thr-fill-hot" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <path class="avn-gauge-fill" id="avn-gauge-thr-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <!-- Reheat annunciator: "AB" arcing along the fill's own inner edge (r33.5),
               spanning the whole reheat zone (abStart->100%, avn.js avnArcPath) rather than the
               live throttle value — the full word is what appears the instant the zone lights up,
               not a readout that grows/shrinks with the needle. avn.js only ever repositions this
               path when abStart itself changes (a per-aircraft constant, not a per-frame one);
               .thr.ab-active (avn.css) is the only thing that toggles it visible. -->
          <path id="avn-gauge-thr-ab-path" fill="none" stroke="none"/>
          <text class="avn-gauge-ab-arc" id="avn-gauge-thr-ab" aria-hidden="true">
            <textPath href="#avn-gauge-thr-ab-path" startOffset="50%" text-anchor="middle">AB</textPath>
          </text>
          <g class="avn-gauge-needle" id="avn-gauge-thr-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">THRL</div>
        <div class="avn-gauge-val" id="avn-gauge-thr-val">&mdash;</div></div>
      </div>
    </div>
    </div>
    <!-- Compact/split only: hidden unless the shell has paginated the icon grid (avnData.pages > 1
         — full view never sends more than 1, so this stays empty there). Mirrors wpn.js's own
         #page-ind exactly (same .mfd-chip, same corner, same hide-unless-multi-page rule) — see
         avn.js updateAvnPageInd. Sibling of .avn-content (not nested in it) so its own
         bottom/right anchor the true panel corner, not that block's smaller, vertically-centred box. -->
    <div class="mfd-chip empty" id="avn-page-ind">PAGE 1/1</div>
  </div>
<script src="/assets/pages/avn/avn-status-policy.js"></script>
<script src="/assets/pages/avn/avn-throttle-policy.js"></script>
<script src="/assets/pages/avn/avn.js"></script>
</body>
</html>
