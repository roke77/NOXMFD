<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — ENG</title>
<!--
  The ENG page (id avn, served at /avn; one of the Avionics hub's pages, docs/adi-hsi-pages.md):
  the FUEL/RPM/HEAT/THRL gauges, in BOTH layouts — a pure reactive renderer fed by the shell over
  postMessage. The system toggles and airframe status live on the SYS page (id afm,
  src/web/pages/afm/).

  The 4 gauges are a 2x2 CSS grid (.avn-gauge-grid) inside one flex column (.avn-content), which
  centres itself vertically within whatever band avn.js's avnContentVerticalExtent names (full:
  the shell-forwarded geom.frameTop/frameHeight; compact: a small top/bottom margin) and spans
  the full panel width.

  Shell -> page messages (all {mfd:true, ...}):
    'avn'        : { name, fuel, throttle, heat, heatColor, rpm, hasAb, abStart } — the live
                   snapshot. `name` is presence-only (drives the NO DATA empty state), never
                   displayed.
    'avn-layout' : full view only: layout:'full' + geom {frameTop, frameHeight}, the vertical band
                   .avn-content centres in. Without it (split panes, outside a shell) the page uses
                   its compact profile, a fixed margin.
    'orient'     : app-wide orientation (drives body.portrait/.landscape).
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/avn/avn.css">
</head>
<body>
  <div class="avn-panel" id="avn-panel">
    <div class="avn-empty mfd-empty" id="avn-empty"><span class="mfd-empty-title">ENG</span>&mdash; NO DATA &mdash;</div>
    <!-- Shared tick ring for every gauge dial below (avn.html's <use> pattern) — lives outside
         .avn-content since <defs>/<use> just need matching ids anywhere in the document. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <g id="avn-gauge-ticks">
          <line class="avn-gauge-tick major" x1="23.13" y1="23.13" x2="28.08" y2="28.08"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="13.86" x2="39.49" y2="17.66"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="12.47" x2="55.32" y2="16.42"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="19.26" x2="69.98" y2="22.49"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="32.75" x2="80.29" y2="34.56"/>
          <line class="avn-gauge-tick major" x1="88"    y1="50"    x2="81"    y2="50"/>
          <line class="avn-gauge-tick"       x1="83.86" y1="67.25" x2="80.29" y2="65.44"/>
          <line class="avn-gauge-tick"       x1="72.34" y1="80.74" x2="69.98" y2="77.51"/>
          <line class="avn-gauge-tick"       x1="55.94" y1="87.53" x2="55.32" y2="83.58"/>
          <line class="avn-gauge-tick"       x1="38.26" y1="86.14" x2="39.49" y2="82.34"/>
          <line class="avn-gauge-tick major" x1="23.13" y1="76.87" x2="28.08" y2="71.92"/>
        </g>
      </defs>
    </svg>
    <!-- Content: the 2x2 gauge grid in one flex column (.avn-content) that centres itself
         vertically and spans the full panel width. -->
    <div class="avn-content" id="avn-content">
    <div class="avn-gauge-grid" id="avn-gauge-grid">
      <div class="avn-gauge fuel" id="avn-gauge-fuel">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-fuel-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <!-- Needle is a thin triangle (base at the hub, offset ±1.2 perpendicular to the
               50,50->30.2,30.2 shaft) instead of a stroked line, so the tip comes to a point rather
               than a round/flat cap; the hub circle below covers the base regardless of how exactly
               it's cut. Same points on all 4 dials — the shaft is identical everywhere. -->
          <g class="avn-gauge-needle" id="avn-gauge-fuel-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">FUEL</div><div class="avn-gauge-val" id="avn-gauge-fuel-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge heat" id="avn-gauge-heat">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-heat-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <g class="avn-gauge-needle" id="avn-gauge-heat-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">HEAT</div><div class="avn-gauge-val" id="avn-gauge-heat-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge rpm" id="avn-gauge-rpm">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <path class="avn-gauge-fill" id="avn-gauge-rpm-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <g class="avn-gauge-needle" id="avn-gauge-rpm-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">RPM</div><div class="avn-gauge-val" id="avn-gauge-rpm-val">&mdash;</div></div>
      </div>
      <div class="avn-gauge thr" id="avn-gauge-thr">
        <div class="avn-gauge-dial-wrap"><svg class="avn-gauge-dial" viewBox="0 0 100 100">
          <!-- fill-hot paints BELOW fill (source order = paint order): it's always drawn full-extent
               to the live throttle value, and fill (green, capped at abStart) paints over it, masking
               red for the MIL portion — the visible red segment is whatever fill doesn't cover. Both
               use the exact same fixed-dasharray reveal as every other gauge (avn.js setAvnGaugeFill),
               so the red segment's leading edge tracks the throttle continuously instead of a
               recomputed [start,end] dash pattern jumping every frame. -->
          <path class="avn-gauge-fill-hot" id="avn-gauge-thr-fill-hot" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <path class="avn-gauge-fill" id="avn-gauge-thr-fill" d="M 25.25 25.25 A 35 35 0 1 1 25.25 74.75"/>
          <circle class="avn-gauge-rim" cx="50" cy="50" r="42"/>
          <path class="avn-gauge-track" d="M 23.13 23.13 A 38 38 0 1 1 23.13 76.87"/>
          <use href="#avn-gauge-ticks"/>
          <!-- Reheat annunciator: "AB" arcing along the fill's own inner edge (r33.5),
               spanning the whole reheat zone (abStart->100%, avn.js avnArcPath) rather than the
               live throttle value — the full word is what appears the instant the zone lights up,
               not a readout that grows/shrinks with the needle. avn.js only ever repositions this
               path when abStart itself changes (a per-aircraft constant, not a per-frame one);
               .thr.ab-active (avn.css) is the only thing that toggles it visible. -->
          <path id="avn-gauge-thr-ab-path" fill="none" stroke="none"/>
          <text class="avn-gauge-ab-arc" id="avn-gauge-thr-ab" aria-hidden="true">
            <textPath href="#avn-gauge-thr-ab-path" startOffset="50%" text-anchor="middle">AB</textPath>
          </text>
          <g class="avn-gauge-needle" id="avn-gauge-thr-needle"><polygon points="50.85,49.15 49.15,50.85 30.2,30.2"/></g>
          <circle class="avn-gauge-hub" cx="50" cy="50" r="2.8"/>
        </svg><div class="avn-gauge-label">THRL</div>
        <div class="avn-gauge-val" id="avn-gauge-thr-val">&mdash;</div></div>
      </div>
    </div>
    </div>
  </div>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/avn/avn-throttle-policy.js"></script>
<script src="/assets/pages/avn/avn.js"></script>
</body>
</html>
