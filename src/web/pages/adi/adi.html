<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>NO XMFD — ADI</title>
<!--
  ADI (docs/adi-hsi-pages.md), served at /adi, laid out like the game's own flight instruments
  panel: heading and airspeed above the attitude ball, AoA and VVI bars either side of it, climb
  rate and altitude below, Mach / AoA / G / radar altitude in the corners. A pure renderer of the
  shell-relayed 'adi' slice; one SVG drawn in 890px-glass coordinates and scaled to the pane by its
  viewBox.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/adi/adi.css">
</head>
<body>
<div class="adi-panel">
  <svg id="adi-svg" class="adi-svg" viewBox="56 14 778 862" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Attitude indicator with angle of attack and vertical speed bars"></svg>
</div>
<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/wpt/wpt-route.js"></script>
<script src="/assets/pages/adi/adi-math.js"></script>
<script src="/assets/pages/adi/adi.js"></script>
</body>
</html>
