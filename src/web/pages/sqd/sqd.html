<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — SQD</title>
<!--
  SQD page — squad membership over Steam P2P (docs/squadron-transport.md), served at /sqd. Reached
  from MAIN like HUD/CFG/MD/RDR/AFM (BEZEL_EXTRAS.main / f35.js's MAIN_EXTRAS), not from another
  page's own nav row.

  A squad is a leader plus zero or more members, no persistence, at most one squad per player. The
  leader invites players currently in the same match (picked from GET /server-players, the game's
  own live roster — no lobby, no pasted SteamID); the invited player explicitly accepts or declines
  (GET /squad's pendingInvite). Only the leader can share data with the squad (SQD.send, wired to
  WPT's own per-route share button); the topology is a star, leader <-> each member, members never
  talk to each other directly.

  All state and actions round-trip through the plugin: GET /squad for the current role/leader/
  members/pending state, POST /command (sqd.create / sqd.invite / sqd.set-callsign / sqd.accept /
  sqd.decline / sqd.leave / sqd.relinquish / sqd.disband). Both squad state and the match roster now
  ride the shell's relayed 'sqd-state'/'server-players-push' pushes (docs/sse-push-refactor.md)
  instead of a recurring poll — one bootstrap GET each on load for the brief gap before the first
  push, then just a message listener.

  Callsign is a fixed picker (issue #42, callsigns.js — a real military callsign list), not free
  text, and CREATE SQUAD also picks a flight number 1-9 (Squadron Callsign System). Both are
  editable later too (EDIT, sqd.set-callsign takes callsign + flight together). Every member's row
  designation renders as "<CALLSIGN> <FLIGHT>-<MEMBER>" (e.g. "TALON 1-2"), where MEMBER is the
  pilot's slot (1 = leader) — changing the flight re-numbers everyone's designation immediately,
  since MEMBER doesn't change.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shared/page-chrome.css">
<link rel="stylesheet" href="/assets/pages/sqd/sqd.css">
</head>
<body>

<div class="sqd-panel" id="sqd-panel">
  <a class="sqd-back" href="/">&lt; MAIN</a>
  <div class="sqd-title">SQUADRON</div>

  <!-- PAD cursor (docs/page-cursor.md) — same fixed-position crosshair WPT uses, driven while SQD
       is the SOI's focused surface. -->
  <div id="pad-cursor" class="pad-cursor"></div>

  <div class="sqd-unavailable" id="sqd-unavailable" style="display:none;">
    Squad requires Steam. Unavailable on this launch.
  </div>

  <div class="sqd-notice" id="sqd-notice" style="display:none;"></div>

  <!-- Each section below shows or hides independently, purely off current state — none of them
       gate one another (docs/squadron-transport.md). A pending invite doesn't hide the player
       list: deciding on an invite and browsing the match's players are separate actions. -->

  <!-- No squad yet (role "none") — the panel is always open: Squad.cs's CreateSquad needs a
       callsign and a flight number up front, so there is no unnamed-squad state to render. INVITE
       only appears on the player list once this has succeeded and role flips to "leader". -->
  <div class="sqd-section sqd-create" id="sqd-create-section" style="display:none;">
    <div class="sqd-create-title">CREATE SQUAD</div>
    <div class="sqd-form-line">
      <span class="sqd-label">CALLSIGN</span>
      <select id="sqd-create-callsign" aria-label="Callsign"></select>
    </div>
    <div class="sqd-form-line">
      <span class="sqd-label">FLIGHT</span>
      <div class="sqd-flights" id="sqd-create-flights"></div>
    </div>
    <div class="sqd-create-foot">
      <span class="sqd-create-des">you will be <span id="sqd-create-des"></span> &middot; leader</span>
      <button class="sqd-btn sqd-btn-lg pad-hoverable" id="sqd-create-confirm">CREATE</button>
    </div>
  </div>

  <!-- Invites awaiting our own accept/decline — queued, oldest first. Accepting any one declines
       the rest (Squad.cs's AcceptInvite) since a pilot can only join one squad. Only populated
       while role is "none" (Squad.cs's HandleInvite rejects an invite while already in a squad). -->
  <div class="sqd-section" id="sqd-invite-section" style="display:none;">
    <div class="sqd-section-head">
      <span>SQUAD INVITES</span><span class="sqd-note" id="sqd-invite-note"></span>
    </div>
    <div id="sqd-invite-cards"><!-- one .sqd-invite-card per pending invite, built by sqd.js --></div>
  </div>

  <!-- The squad itself, once one exists (as leader or member). EDIT (leader only,
       sqd.set-callsign) swaps the header card for the callsign editor in place; the flight number
       is editable there too — sqd.set-callsign takes both. -->
  <div class="sqd-section" id="sqd-squad-section" style="display:none;">
    <div class="sqd-squad-card" id="sqd-squad-card">
      <span class="sqd-squad-title" id="sqd-squad-head"></span>
      <span class="sqd-note" id="sqd-squad-note"></span>
      <span class="sqd-spacer"></span>
      <div class="sqd-section-actions">
        <button class="sqd-btn pad-hoverable" id="sqd-callsign-edit-btn" style="display:none;">EDIT</button>
        <button class="sqd-btn pad-hoverable" id="sqd-leave">LEAVE</button>
        <button class="sqd-btn sqd-btn-red pad-hoverable" id="sqd-disband" style="display:none;">DISBAND</button>
      </div>
    </div>
    <div class="sqd-squad-card sqd-editing" id="sqd-callsign-edit" style="display:none;">
      <select id="sqd-callsign-select" aria-label="Callsign"></select>
      <div class="sqd-flights" id="sqd-callsign-flights"></div>
      <span class="sqd-spacer"></span>
      <button class="sqd-btn pad-hoverable" id="sqd-callsign-set">APPLY</button>
      <button class="sqd-btn sqd-btn-dim pad-hoverable" id="sqd-callsign-cancel">CANCEL</button>
    </div>
    <div class="sqd-table">
      <div class="sqd-cols">
        <span>DESIGNATION</span><span>PILOT</span><span>AIRCRAFT</span><span></span>
      </div>
      <div class="sqd-rows" id="sqd-squad-rows"></div>
    </div>
  </div>

  <!-- Players in this match who aren't in our squad (collapsible, sqd.js: open while we're not in a
       squad, collapsed once we lead one; hidden for a plain member). INVITE appears only for a LEADER. Its body is the page's
       one flexible, scrolling region. -->
  <div class="sqd-section sqd-roster" id="sqd-roster-section">
    <div class="sqd-section-head sqd-collapsible pad-hoverable" id="sqd-roster-head" role="button" tabindex="0">
      <span id="sqd-roster-title">UNASSIGNED PLAYERS</span><span class="sqd-chevron" id="sqd-roster-chevron"></span>
    </div>
    <div class="sqd-roster-body" id="sqd-roster-body">
      <div class="sqd-rows" id="sqd-roster-rows"></div>
    </div>
  </div>
</div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script type="module" src="/assets/pages/sqd/sqd.js"></script>
</body>
</html>
