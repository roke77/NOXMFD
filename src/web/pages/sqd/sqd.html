<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — SQD</title>
<!--
  SQD page — squad membership over Steam P2P (docs/squadron-transport.md), served at /sqd. Reached
  from MAIN like HUD/CFG/MD/RDR/AFM (BEZEL_EXTRAS.main / f35.js's MAIN_EXTRAS), not from another
  page's own nav row.

  A squad is a leader plus zero or more members, no persistence, at most one squad per player. The
  leader invites players currently in the same match (picked from GET /server-players, the game's
  own live roster — no lobby, no pasted SteamID); the invited player explicitly accepts or declines
  (GET /squad's pendingInvite). Only the leader can share data with the squad (SQD.send, wired to
  WPT's own per-route share button); the topology is a star, leader <-> each member, members never
  talk to each other directly.

  All state and actions round-trip through the plugin: GET /squad for the current role/leader/
  members/pending state, POST /command (sqd.create / sqd.invite / sqd.set-callsign / sqd.accept /
  sqd.decline / sqd.leave / sqd.relinquish / sqd.disband). Both squad state and the match roster now
  ride the shell's relayed 'sqd-state'/'server-players-push' pushes (docs/sse-push-refactor.md)
  instead of a recurring poll — one bootstrap GET each on load for the brief gap before the first
  push, then just a message listener.

  Callsign is a fixed picker (issue #42, callsigns.js — a real military callsign list), not free
  text, and CREATE SQUAD also picks a flight number 1-9 (Squadron Callsign System). Both are
  editable later too (EDIT, sqd.set-callsign takes callsign + flight together). Every member's row
  designation renders as "<CALLSIGN> <FLIGHT>-<MEMBER>" (e.g. "TALON 1-2"), where MEMBER is the
  existing join-order number (1 = leader) — changing the flight re-numbers everyone's designation
  immediately, since MEMBER never changes.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shared/page-chrome.css">
<link rel="stylesheet" href="/assets/pages/sqd/sqd.css">
</head>
<body>

<div class="sqd-panel" id="sqd-panel">
  <a class="sqd-back" href="/">&lt; MAIN</a>
  <div class="sqd-title">SQUADRON</div>

  <!-- PAD cursor (docs/page-cursor.md) — same fixed-position crosshair WPT uses (this page's own
       body scrolls too), driven while SQD is the SOI's focused surface. -->
  <div id="pad-cursor" class="pad-cursor"></div>

  <div class="sqd-unavailable" id="sqd-unavailable" style="display:none;">
    Squad requires Steam. Unavailable on this launch.
  </div>

  <div class="sqd-notice" id="sqd-notice" style="display:none;"></div>

  <!-- Each section below shows or hides independently, purely off current state — none of them
       gate one another (docs/squadron-transport.md). In particular, a pending invite no longer
       hides the roster below it: deciding on an invite and inviting/browsing players in this match
       are two different things, and hiding the whole page down to just the invite card while one
       was outstanding forced declining it just to get back to a page you could otherwise still use. -->

  <!-- No squad yet (role "none") — starting one is explicit: a big centered CREATE SQUAD button,
       which swaps in an inline callsign + flight-number picker plus CREATE/CANCEL (same in-place-
       swap idiom as the squad section's own EDIT below). Squad.cs's CreateSquad requires both up
       front, so there's no unnamed-squad state to render — INVITE only appears on the roster once
       this has succeeded and role flips to "leader". Mutually exclusive with the squad section
       right below it (role is never simultaneously "none" and "leader"/"member"). -->
  <div class="sqd-section" id="sqd-create-section" style="display:none;">
    <div class="sqd-create-prompt" id="sqd-create-prompt">
      <button class="sqd-btn sqd-create-btn pad-hoverable" id="sqd-create-open">CREATE SQUAD</button>
    </div>
    <div class="sqd-create-form" id="sqd-create-form" style="display:none;">
      <select id="sqd-create-callsign" aria-label="Callsign"></select>
      <select id="sqd-create-flight" aria-label="Flight number"></select>
      <button class="sqd-btn pad-hoverable" id="sqd-create-confirm">CREATE</button>
      <button class="sqd-btn sqd-btn-ghost pad-hoverable" id="sqd-create-cancel">CANCEL</button>
    </div>
  </div>

  <!-- The squad itself, once one exists (as leader or member). The title doubles as the callsign
       editor: EDIT (leader only, sqd.set-callsign) swaps the <span> for an inline input + SET, in
       place, rather than a separate section. The flight number (Squadron Callsign System) is
       editable here too now, not just at CREATE time — sqd.set-callsign takes both. -->
  <div class="sqd-section" id="sqd-squad-section" style="display:none;">
    <div class="sqd-section-head">
      <span id="sqd-squad-head">YOUR SQUAD</span>
      <div class="sqd-callsign-edit" id="sqd-callsign-edit" style="display:none;">
        <select id="sqd-callsign-select" aria-label="Callsign"></select>
        <select id="sqd-callsign-flight" aria-label="Flight number"></select>
        <button class="sqd-btn pad-hoverable" id="sqd-callsign-set">SET</button>
      </div>
      <div class="sqd-section-actions">
        <button class="sqd-btn sqd-btn-ghost pad-hoverable" id="sqd-callsign-edit-btn" style="display:none;">EDIT</button>
        <button class="sqd-btn sqd-btn-ghost pad-hoverable" id="sqd-leave">LEAVE</button>
        <button class="sqd-btn sqd-btn-ghost pad-hoverable" id="sqd-disband" style="display:none;">DISBAND</button>
      </div>
    </div>
    <div class="sqd-rows" id="sqd-squad-rows"></div>
  </div>

  <!-- Invites awaiting our own accept/decline — queued, oldest first: a second (or third...) leader
       inviting us while we're still deciding on an earlier one no longer replaces it, it queues
       alongside it. Accepting any one of these declines the rest automatically (Squad.cs's
       AcceptInvite) since a pilot can only join one squad. Only ever populated while role is
       "none" (Squad.cs's HandleInvite rejects an invite while already in a squad), so this and the
       squad section above are naturally mutually exclusive without needing to say so here. -->
  <div class="sqd-section" id="sqd-invite-section" style="display:none;">
    <div class="sqd-section-head"><span>SQUAD INVITES</span></div>
    <div id="sqd-invite-cards"><!-- one .sqd-invite-card per pending invite, built by sqd.js --></div>
  </div>

  <!-- Invites sent, awaiting the target's own accept/decline. Leader-only, so it's already gated to
       the same audience as the roster below it. -->
  <div class="sqd-section" id="sqd-pending-section" style="display:none;">
    <div class="sqd-section-head"><span>INVITED — AWAITING RESPONSE</span></div>
    <div class="sqd-rows" id="sqd-pending-rows"></div>
  </div>

  <!-- Whoever else is in this match right now. Visible unless we're already a plain MEMBER of
       someone else's squad — deciding on an incoming invite (above) doesn't hide this, since
       browsing and answering an invite are independent actions. Each row's own INVITE button only
       appears once we're a LEADER (Squad.cs's Invite() requires CreateSquad to have already run);
       while role is "none" this is browse-only, pointing at the CREATE SQUAD prompt above it. -->
  <div class="sqd-section" id="sqd-roster-section">
    <div class="sqd-section-head"><span>PLAYERS IN THIS MATCH</span></div>
    <div class="sqd-rows" id="sqd-roster-rows"></div>
    <div class="sqd-empty" id="sqd-roster-empty">&mdash; NO OTHER PLAYERS DETECTED &mdash;</div>
  </div>
</div>

<script src="/assets/services/send-command.js"></script>
<script type="module" src="/assets/pages/sqd/sqd.js"></script>
</body>
</html>
