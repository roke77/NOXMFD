<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD - FCR</title>
<!--
  Bare FCR page served at /rdr (docs/rdr-page.md). A pure reactive renderer fed by the shell over
  postMessage; single source of truth for BOTH layouts (full-screen iframe + split pane).

  An F-16 FCR B-scope: ownship implied at bottom-centre, bearing left-to-right, range bottom-to-top.
  Shows only the air contacts the player's OWN radar detects (aircraft only). When the aircraft
  carries no radar it shows a — not available — placeholder instead.

  The outer frame + ownship caret are static; the scan-limit lines (cone-dependent), the contact
  bricks with their velocity-vector stubs, and the bottom readout are painted by rdr.js from each
  message. A locked contact (in the player's target set) is amber with a circle; the readout tracks
  the first locked contact.

  Shell -> page messages (all {mfd:true, ...}):
    'rdr' : { present, range, cone, items:[{ id, az, rng, alt, rhdg, tg, n }], pb:[{ id, az, rng, alt, rhdg, tid }] }
            present=false -> placeholder. az = signed deg off nose, rng = world units, range = scope
            max range (world units), cone = antenna half-angle (deg; 0 = none), rhdg = travel heading
            relative to nose (deg), alt = altitude (m), tg = 1 when locked.
            pb = the player's own AA missiles with a locked active-radar seeker (issue #40), same
            az/rng/rhdg projection as items; tid is the id of the item it's pursuing (0 = none/off-
            scope). Drawn as a slender blue dart (RWR's threat-marker shape) with a solid line to
            that target, flickering yellow/red on RWR's own timer, when the target is on-scope.

    action  : 'zoom-in'/'zoom-out' step the displayed range in/out (RNG+/RNG-, R+/R- bezel keys,
              cursor overflow at the scope's top/bottom edge) through RANGE_STEPS (25%/50%/100% of
              the radar's true max), persisted in sessionStorage. Reuses the SAME action names MAP's
              Zoom In/Out keybind sends via SOI (docs/page-cursor.md) — TGT repurposes it to scroll
              its list, RDR repurposes it to range, no new keybind needed.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/rdr/rdr.css">
</head>
<body>
  <div class="rdr-panel">
    <svg class="rdr-scope" viewBox="0 0 520 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <text id="rdr-mode"  x="60"  y="42" class="rdr-hdr">RWS</text>
      <text id="rdr-range" x="460" y="42" class="rdr-hdr" text-anchor="end">40</text>

      <rect x="60" y="70" width="400" height="440" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      <g id="rdr-grid"></g>
      <g id="rdr-contacts"></g>
      <g id="rdr-pitbull"></g>
      <g id="rdr-cursor-g"></g>

      <!-- Antenna-sweep caret: a small T sitting just above the frame's bottom edge (its
           stem ends clear of the 2px frame stroke, which would otherwise cover it at y=510),
           drawn at centre; rdr.css's animation swings it left<->right through this drawn position
           (CSS translateX is in the SVG's own viewBox units, so ±186 reaches the frame's L/R
           insets). Shown only while the radar is actively emitting — see rdr.js render(). -->
      <g id="rdr-sweep">
        <line x1="252" y1="494" x2="268" y2="494" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
        <line x1="260" y1="494" x2="260" y2="504" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
      </g>

      <polygon points="260,510 246,534 260,526 274,534" fill="rgba(255,255,255,0.7)"/>
      <text id="rdr-azl" x="60"  y="534" class="rdr-az">-60</text>
      <text id="rdr-azr" x="460" y="534" class="rdr-az" text-anchor="end">+60</text>

      <text id="rdr-r1" x="60"  y="566" class="rdr-read"></text>
      <text id="rdr-r2" x="60"  y="588" class="rdr-read"></text>
      <text id="rdr-lk" x="460" y="566" class="rdr-read" text-anchor="end"></text>
    </svg>
    <div id="rdr-cursor" class="rdr-cursor"></div>
  </div>

  <div class="rdr-unavailable mfd-empty" id="rdr-unavailable">
    <span class="mfd-empty-title">FCR</span>&mdash; NOT AVAILABLE &mdash;
  </div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/rdr/rdr.js"></script>
</body>
</html>
