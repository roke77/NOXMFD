<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — RDR</title>
<!--
  Bare RDR page served at /rdr (docs/rdr-page.md). A pure reactive renderer fed by the shell over
  postMessage; single source of truth for BOTH layouts (full-screen iframe + split pane).

  An F-16 FCR B-scope: ownship implied at bottom-centre, bearing left-to-right, range bottom-to-top.
  Shows only the air contacts the player's OWN radar detects (aircraft only). When the aircraft
  carries no radar it shows a — not available — placeholder instead.

  The outer frame + ownship caret are static; the scan-limit lines (cone-dependent), the contact
  bricks with their velocity-vector stubs, and the bottom readout are painted by rdr.js from each
  message. A locked contact (in the player's target set) is amber with a circle; the readout tracks
  the first locked contact.

  Shell -> page messages (all {mfd:true, ...}):
    'rdr' : { present, range, cone, items:[{ id, az, rng, alt, rhdg, tg, n }] }
            present=false -> placeholder. az = signed deg off nose, rng = world units, range = scope
            max range (world units), cone = antenna half-angle (deg; 0 = none), rhdg = travel heading
            relative to nose (deg), alt = altitude (m), tg = 1 when locked.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/rdr/rdr.css">
</head>
<body>
  <div class="rdr-panel">
    <svg class="rdr-scope" viewBox="0 0 520 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <text id="rdr-mode"  x="60"  y="42" class="rdr-hdr">RWS</text>
      <text id="rdr-range" x="460" y="42" class="rdr-hdr" text-anchor="end">40</text>
      <text                x="260" y="42" class="rdr-tag" text-anchor="middle">RDR</text>

      <rect x="60" y="70" width="400" height="440" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      <g id="rdr-grid"></g>
      <g id="rdr-contacts"></g>

      <polygon points="260,510 246,534 260,526 274,534" fill="rgba(255,255,255,0.7)"/>
      <text id="rdr-azl" x="60"  y="534" class="rdr-az">-60</text>
      <text id="rdr-azr" x="460" y="534" class="rdr-az" text-anchor="end">+60</text>

      <text id="rdr-r1" x="60"  y="566" class="rdr-read"></text>
      <text id="rdr-r2" x="60"  y="588" class="rdr-read"></text>
      <text id="rdr-lk" x="460" y="566" class="rdr-read" text-anchor="end"></text>
    </svg>
    <div id="rdr-na" class="rdr-na" hidden>— not available —</div>
  </div>
<script src="/assets/pages/rdr/rdr.js"></script>
</body>
</html>
