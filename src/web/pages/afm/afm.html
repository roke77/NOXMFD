<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — SYS</title>
<!--
  The SYS page (id afm, served at /afm; one of the Avionics hub's pages): airframe status, the
  pylons' loaded weapons and the 8 system toggles, in BOTH layouts — a pure reactive renderer fed
  by the shell over postMessage. The engine gauges are the ENG page (id avn).

  compact : split-pane / half-height. Name + frame use fixed pixel offsets from the iframe edges
            (no bezel keys to anchor against). The default.
  full    : single full-screen iframe. Name sits at the top of the bezel key[0] row in a band no
            taller than compact's; the silhouettes span from below the name to the bottom strip —
            the shell forwards those pixel positions. Enabled by layout:'full' in afm-layout.

  Shell -> page messages (all {mfd:true, ...}):
    'afm'        : { name, parts, failures, pylons, gearDown, radar, guns, ignition, assist, nvg,
                   navLights, turret } — the live snapshot (same data AVN's
                   shell-side state already carries; the shell just points a second page at it).
                   pylons is [{n, s, w}] — hardpoint marker name + live state, mirroring the
                   cockpit's own weapon-station panel: 'armed' (has ammo), 'exhausted' (mounted,
                   fired out), or 'empty' (nothing mounted — a distinct flat gray, not just "not
                   armed") — and the mounted weapon's name ('' when none). loadout is WPN's
                   [{n, a, f}] list, shown instead when the front view has no pylon markers.
    'afm-layout' : geometry — layout:'full' + geom {headerTop, headerHeight, frameTop, frameHeight}
                   in full; omitted in compact (the page defaults to the CSS fixed offsets).
    'orient'     : app-wide orientation (drives body.portrait/.landscape).
  Vertical stack, top to bottom: name, top-down damage silhouette, frontal silhouette (+ pylon
  markers, the outer pylons' boxes beside it), the other pylons' boxes. The frontal silhouette bg +
  pylon-marker layout are captured from the cockpit's weapon-station-armed panel and fetched from
  /airframe[-layout]?type=<name>__front (part "__front" for the image; the "__front"-suffixed type
  key for the marker layout — same endpoints the damage silhouette uses, just a distinct key). The
  layout is {parts: [{n, cx, cy, w, h}]} for markers on the drawing, or [{n, label: true}] for
  stations with no point on it, drawn as a row of squares over their boxes; image:false means the
  airframe has no front view (stations taken from its hardpoints), and an empty parts list shows
  the loadout instead. The damage silhouette bg + part masks + layout
  come from the plain /airframe[-layout]?type=<name>.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/afm/afm.css">
</head>
<body>
  <div class="afm-panel" id="afm-panel">
    <div class="afm-header" id="afm-header">
      <div class="afm-name" id="afm-name"></div>
    </div>
    <!-- One circuit-style line per pylon, marker to its box, in the pylon's colour. Before the front section so the
         markers paint over the line ends. -->
    <svg class="afm-pylon-links" id="afm-pylon-links" aria-hidden="true"></svg>
    <!-- Label-station airframes (afm.js afmFrontLabels): one square per station in a row under the
         front view, each above its weapon box. After the links so the squares cover the line ends. -->
    <div class="afm-pylon-squares" id="afm-pylon-squares"></div>
    <div class="afm-front-section" id="afm-front-section">
      <img class="afm-front" id="afm-front" alt="">
      <div class="afm-front-markers" id="afm-front-markers"></div>
    </div>
    <!-- One box per hardpoint, left to right in marker order, each showing the weapon loaded on its
         pylon. The outermost two sit beside the frontal silhouette, by the outer pylons, and the
         rest fill a row below it. -->
    <div class="afm-pylon-box afm-pylon-side left" id="afm-pylon-left"></div>
    <div class="afm-pylon-box afm-pylon-side right" id="afm-pylon-right"></div>
    <div class="afm-pylon-row" id="afm-pylon-row"></div>
    <div class="afm-frame" id="afm-frame">
      <img class="afm-bg" id="afm-bg" alt="">
      <div class="afm-parts" id="afm-parts"></div>
    </div>
    <!-- The 8 avionics toggles the SYS page shows, as lit buttons in the F-35 master strip's style
         (glyph, lamp, name). Two columns over the full-width silhouette bands, outside the drawings;
         each click sends avn.toggle for its own group, same as SYS's tiles. -->
    <div class="afm-flags left" id="afm-flags-left">
      <button type="button" class="afm-flag off" id="afm-flag-gear" data-group="gear" aria-pressed="false">
        <span class="afm-flag-icon afm-flag-mask"></span>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">GEAR</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-radar" data-group="radar" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 9.6a11 11 0 0 1 15 0"/><path d="M7.5 12.6a6.5 6.5 0 0 1 9 0"/>
          <circle cx="12" cy="16.1" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">RADAR</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-guns" data-group="guns" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 12h6"/><path d="M10.5 8H8a4 4 0 0 0 0 8h2.5"/><path d="M13.5 8H16a4 4 0 0 1 0 8h-2.5"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">GUNS</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-eng" data-group="eng" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10v6"/><path d="M12 5v3"/><path d="M10 5h4"/><path d="M5 13h-2"/><path d="M6 10h2l2 -2h3.382a1 1 0 0 1 .894 .553l1.448 2.894a1 1 0 0 0 .894 .553h1.382v-2h2a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-2v-2h-3v2a1 1 0 0 1 -1 1h-3.465a1 1 0 0 1 -.832 -.445l-1.703 -2.555h-2v-6"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">ENG</span>
      </button>
    </div>
    <div class="afm-flags right" id="afm-flags-right">
      <button type="button" class="afm-flag off" id="afm-flag-assist" data-group="assist" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M5.3 12.3 H7.5 L10 13.7 L12 12.5 L14 13.7 L16.5 12.3 H18.7"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">ASSIST</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-nvg" data-group="nvg" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2.5 12s3.4-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.4 6.5-9.5 6.5-9.5-6.5-9.5-6.5z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">NVG</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-lights" data-group="lights" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2"/><path d="M12 18.8v2"/><path d="M3.2 12h2"/><path d="M18.8 12h2"/><path d="M5.5 5.5l1.6 1.6"/><path d="M16.9 16.9l1.6 1.6"/><path d="M18.5 5.5l-1.6 1.6"/><path d="M7.1 16.9l-1.6 1.6"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">LIGHTS</span>
      </button>
      <button type="button" class="afm-flag off" id="afm-flag-turret" data-group="turret" aria-pressed="false">
        <svg class="afm-flag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7.5 13 L4 18.5 H20 L16.5 13"/><path d="M8 13 V11 Q8 8 12 8 Q16 8 16 11 V13"/><path d="M8 10.8 H3 V12.8 H8"/>
        </svg>
        <span class="afm-flag-lamp"></span>
        <span class="afm-flag-label">TURRET</span>
      </button>
    </div>
    <div class="afm-empty mfd-empty" id="afm-empty"><span class="mfd-empty-title">SYS</span>&mdash; NO DATA &mdash;</div>
  </div>
<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/afm/afm-bg-policy.js"></script>
<script src="/assets/pages/afm/afm-failure-policy.js"></script>
<script src="/assets/pages/afm/afm-layout-policy.js"></script>
<script src="/assets/pages/afm/avn-status-policy.js"></script>
<script src="/assets/pages/afm/afm.js"></script>
</body>
</html>
