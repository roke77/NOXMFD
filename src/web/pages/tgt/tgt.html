<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — TGT</title>
<!--
  Bare TGT page served at /tgt — a fully-clickable replica of the game's in-cockpit
  "TARGET SELECTION" panel (TargetListSelector). Unlike the other frame pages this one is NOT
  bezel-driven: every filter is a clickable component, and the page POSTs the tgt.* commands
  itself (see /assets/services/send-command.js + src/plugin/CommandDispatcher.cs). The only bezel
  key is the shell-owned MAIN back label. See docs/tgt-page.md.

  Shell -> page messages (all {mfd:true, ...}):
    'tgt'         : the whole filter block mirrored from the mod —
                    { present, laser, hud, faction:[{n,on}], category:[{n,on}], vehicle:[{n,on}] }.
                    present:false → the game's TargetListSelector isn't up; show UNAVAILABLE.
    'tgt-targets' : the selected-target list —
                    { items:[{ id, n, g, r, f, tti, wpn, hd, sp, al, h }] } → the list under the filters.
                    tti/wpn: the player's own in-flight weapon tracking that lock (seconds to impact,
                    weapon unitName); absent when nothing is.
                    hd/sp/al/h (issue #88) are the same HasDetail/SpeedReading/AltReading/Heading
                    fields MAP's hover tooltip already reads — see the DETAILED/COMPACT note below.
    'orient'      : app-wide orientation (kept for parity).

  Interaction (touch-friendly, mirrors the game):
    tap a filter        → toggle it (tgt.set {group,index,on})
    long-press a filter → "only this" (tgt.only {group,index}) — isolate it in its group
    RESET FILTERS       → tgt.reset   (all filters back on)
    CLEAR TARGETS       → tgt.clear   (deselect every target)
    tap a target's row  → deselect it (target.deselect {id}) — anywhere on the row, no checkbox
    designation dock    → ADD / REPLACE (td.accept {on}) or DISMISS (td.dismiss) — see the dock's own comment

  SRC column: SENSOR (live), DATALINK (relayed, still trustworthy), or STALE (relayed, no longer
  trustworthy — the same drift-past-threshold check that pops the "?" on the game's own TGP;
  docs/tgt-stale-lock.md). STALE implies DATALINK.

  CLEAR DATALINK / CLEAR STALE buttons (docs/tgt-datalink-cancel.md, docs/tgt-stale-lock.md) —
  mod-only controls, not one of the game's real TargetListSelector filters (those are
  FRIENDLY/ENEMY/category/vehicle/LASER/HUD above). All four action buttons share one docked row
  under the list; the two clears show how many rows they would drop:
    tap CLEAR DATALINK → tgt.clear-datalink (deselect just the datalink-only targets)
    tap CLEAR STALE    → tgt.clear-stale    (deselect just the stale-locked targets)

  PAD cursor (docs/page-cursor.md) — while this TGT is the SOI's focused surface, the shell forwards
  the same cursor transport MAP uses, plus Cursor Select's live held state
  ({mfd:true, action:'cursor'|'cursor-held'|'cursor-focus'}): held past the long-press threshold
  mirrors a filter cell's own long-press "only" (or a preset card's save) when the cursor's over one,
  releasing before that mirrors the tap instead — filter toggle or preset recall. Every other
  CURSORABLE control (list row, the four action buttons, LASER/HUD) only ever has a tap outcome,
  since they have no hold behaviour to mirror. Hovering the crosshair over
  any control highlights it (.pad-hoverable/.pad-hover, shared/theme.css) the same way a real mouse
  would. Zoom In/Out (map-act's 'zoom-in'/'zoom-out') are repurposed here to scroll the target list
  instead of zooming (nothing to zoom on this page).

  Next/Previous Target (docs/tgt-cycle-focus.md) steps which locked target is "focused" — a shared,
  server-side id (TargetFocus.cs) reaching TGT/FCR/HSD in every open browser, not a page-local
  concept — and that's the only row-highlight state TGT keeps: the focused row draws an outline,
  amber or grey depending on which control currently owns Cursor Select (see "Select arbitration"
  below). Datalink/Stale keybinds (docs/tgt-keybind-nav.md) clear those locks in the game directly
  (Keybinds.cs / CommandDispatcher.cs) — same as Next/Previous Target, this works regardless of
  which display (if any) is focused, not just while this TGT is SOI-focused. The map-act broadcast
  below still reaches this page too, when it happens to be focused, but only re-issues the same
  already-applied clear — the keybind equivalents of tapping the DATALINK/STALE buttons.

  Select arbitration ('tgt-next'/'tgt-prev' actions, docs/tgt-cycle-focus.md): Next/Previous Target
  hides the free crosshair and hands Cursor Select to the focused lock instead (amber outline,
  Select deselects it directly, no aiming needed) — mutually exclusive with the PAD cursor above,
  the same way DATALINK/STALE's own hold-vs-tap arbitration works. Moving the crosshair (an actual
  deflection, not the (0,0) a key release reports) hands Select back to it and un-hides it (grey
  outline on the focused row meanwhile — still focused, but Select won't act on it until
  Next/Previous is pressed again). Gaining SOI focus always starts crosshair-active.

  TGT filter presets (issue #78) — 5 fixed numbered slots (TgtPresetStore), server-side so any
  browser or the KEY page's own 5 recall keybinds can save/load one, same model as HUD's own
  presets (docs/hud-presets.md, docs/tgt-presets.md):
    tap a card  → recall that slot: tgt-preset.load {index} (an empty slot just becomes current)
    hold a card → the SAVE PRESET dialog (below): SAVE captures the current filters into that slot
                  under the typed name (tgt-preset.save {wname,index}), CLEAR empties the slot
                  (tgt-preset.delete {index}); the completed hold never also recalls
  The five cards mirror GET /tgt-presets (re-fetched when the 'tgt' block's `preset` field — the
  current slot's index/name, riding the existing telemetry — changes); the lit card is the current
  slot.

  DETAILED/COMPACT flight-data toggle (issue #88) — bottom right of the list, same switch
  component/labels as AKF's own density toggle (akf.html/akf.js), but the opposite default: TGT
  starts COMPACT (the NAME/WPN/TTI/TD/SRC/RNG/GRID columns only). DETAILED appends SPD/ALT/HDG after
  GRID, using each target's
  hd/sp/al/h fields (see the 'tgt-targets' message above) — the same HasDetail-gated data MAP's own
  hover tooltip already shows. A target with hd:false (stale lock, or a non-aircraft/missile
  category) renders "—" in all three. Purely a client-local display preference, like AKF's: not
  persisted across a reload, no server round-trip.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shared/lit-panel.css">
<link rel="stylesheet" href="/assets/pages/tgt/tgt.css">
</head>
<body>
  <div class="tgt-panel" id="tgt-panel">
    <div class="tgt-head">
      <span class="tgt-title">TARGET SELECTION</span>
    </div>

    <!-- TGT filter presets (issue #78): five fixed slots as cards, built by tgt.js from
         GET /tgt-presets. Position identifies the slot; the lit card is the current one. Tap recalls,
         hold saves — see docs/tgt-presets.md. -->
    <section class="tgt-presets" aria-label="Filter presets">
      <div class="tgt-section-title">PRESETS <span class="tgt-section-hint" id="tgt-presets-hint">(hold to save)</span></div>
      <div class="preset-cards" id="preset-cards" aria-describedby="tgt-presets-hint"></div>
    </section>

    <section class="tgt-filter-section" aria-labelledby="tgt-filters-title">
      <div class="tgt-section-title" id="tgt-filters-title">FILTERS <span class="tgt-section-hint">(hold to only)</span></div>
      <div class="tgt-top">
        <div class="tgt-filters">
          <div class="tgt-row" id="row-faction"></div>
          <div class="tgt-row" id="row-category"></div>
        </div>
        <div class="tgt-modes">
          <button class="lit tgt-mode pad-hoverable" id="mode-laser" data-mode="laser">LASER</button>
          <button class="lit tgt-mode pad-hoverable" id="mode-hud"   data-mode="hud">HUD</button>
        </div>
      </div>
      <div class="tgt-vehicles" id="row-vehicle"></div>
    </section>

    <!-- Selected-target list: NAME (header reads "TARGETS (N)", the live selected count) / WPN / TTI /
         [TD] / SRC / RNG / GRID / [SPD / ALT / HDG] per row. The whole row is clickable and deselects
         that target — no checkbox, the row itself already reads as "this is selected". .tgt-list-scroll
         scrolls both axes so a narrow panel (small-screen F-35) overflows instead of squeezing
         columns unreadably thin; .tgt-list-head is sticky within it so the header stays put
         vertically but still tracks the rows horizontally.
         WPN / TTI (docs/hud-tti-estimate.md): the player's own in-flight guided weapon tracking that
         lock, and its time to impact as M:SS. Both blank when nothing is tracking it.
         TD (issue #47 follow-up): a squad leader's own designations, one squad-slot number per
         member this target is assigned to (blank if none). Leader-only — hidden entirely (both this
         header cell and each row's .tl-td) via tgt.css's .has-td-col for anyone not currently
         leading a squad, including someone who never joined one, so it never shows a column of
         meaningless blanks.
         SPD / ALT / HDG (issue #88): flight data, hidden by default (COMPACT) and revealed by the
         DETAILED/COMPACT toggle below — tgt.css's .has-flight-col, same show/hide mechanics as
         .has-td-col above, driven by tgt.js's own client-local toggle rather than squad state.
         A row that arrived through an accepted squad designation carries a small TD tag after its
         name, so a member can tell the leader's targets from their own. -->
    <div class="tgt-list" id="tgt-list">
      <div class="tgt-list-scroll">
        <div class="tgt-list-head">
          <!-- NAME / SRC / RNG are sort buttons (TargetSort.cs, shared by every TGT view): tap sorts by
               that column / reverses it, long-press goes back to the game's lock order. -->
          <!-- NAME header reads "TARGETS (N)" — the total selected count in amber, right in the
               column header, so a squadron lead can match ordnance count to target count at a
               glance without leaving the map to check the cockpit MFD. -->
          <button class="tl-sort pad-hoverable" data-sort="n">TARGETS <span class="tgt-count-n" id="tgt-count-n"></span></button><span>WPN</span><span>TTI</span><span class="tgt-td-head">TD</span><button class="tl-sort pad-hoverable" data-sort="src">SRC</button><button class="tl-sort pad-hoverable" data-sort="r">RNG</button><span>GRID</span><span class="tgt-flight-head">SPD</span><span class="tgt-flight-head">ALT</span><span class="tgt-flight-head">HDG</span>
        </div>
        <div class="tgt-list-rows" id="tgt-list-rows"></div>
        <div class="tgt-list-empty" id="tgt-list-empty">&mdash; NO TARGETS SELECTED &mdash;</div>
      </div>

      <!-- Squad leader's designation (docs/target-designator.md): floats over the bottom of the
           target list — above any rows and the scrollbar — until ADD, REPLACE or DISMISS answers
           it. ADD selects the designated targets you don't already have, REPLACE drops every
           current lock for the leader's list, DISMISS closes it with nothing selected. The bar's
           label opens the names above it. Shown whenever /td-state carries a pending designation,
           whatever this pilot's role (only a member ever receives one). tgt.js's renderDock. -->
      <div class="tgt-td-dock" id="tgt-td-dock" role="region" aria-label="Designation from your squad leader" hidden>
        <div class="tgt-td-drawer" id="tgt-td-drawer" hidden></div>
        <div class="tgt-td-bar">
          <span class="tgt-td-lamp"></span>
          <button type="button" class="tgt-td-toggle pad-hoverable" id="tgt-td-toggle" aria-expanded="false"><span class="tgt-td-label" id="tgt-td-label"></span><span class="tgt-td-show" id="tgt-td-show"></span></button>
          <button type="button" class="tgt-td-btn add pad-hoverable" id="tgt-td-add"></button>
          <button type="button" class="tgt-td-btn replace pad-hoverable" id="tgt-td-replace" aria-label="Replace your targets with the leader's">REPLACE</button>
          <button type="button" class="tgt-td-btn dismiss pad-hoverable" id="tgt-td-dismiss" aria-label="Dismiss the designation">DISMISS</button>
        </div>
      </div>
    </div>

    <!-- DETAILED/COMPACT flight-data toggle (issue #88) — see the header comment above, akf.js for
         the identical component this is ported from. Right-aligned under the list. -->
    <div class="tgt-toolbar">
      <div class="tgt-density-toggle pad-hoverable" id="tgt-density-toggle" title="Toggle target list flight-data columns">
        <span class="tgt-density-label tgt-density-label-left">DETAILED</span>
        <span class="tgt-density-switch"><span class="tgt-density-knob"></span></span>
        <span class="tgt-density-label tgt-density-label-right">COMPACT</span>
      </div>
    </div>

    <!-- Action dock, outside the scrolling list so it is always reachable: data-cmd is the tgt.*
         command each button sends. CLEAR DATALINK / CLEAR STALE are mod-only, not real
         TargetListSelector filters — see the header comment above; their counts are tgt.js's. -->
    <div class="tgt-actions" aria-label="Target actions">
      <button class="tgt-action pad-hoverable reset" data-cmd="reset">RESET FILTERS</button>
      <button class="tgt-action pad-hoverable clear" data-cmd="clear">CLEAR TARGETS</button>
      <button class="tgt-action pad-hoverable datalink" data-cmd="clear-datalink">CLEAR DATALINK <span class="tgt-action-count" id="datalink-count"></span></button>
      <button class="tgt-action pad-hoverable stale" data-cmd="clear-stale">CLEAR STALE <span class="tgt-action-count" id="stale-count"></span></button>
    </div>

    <!-- SAVE PRESET dialog, opened by holding a preset card: the same scrim / bordered panel / amber
         entry as MAP's TGP slew keypad and NOAutopilot's target keypad. CANCEL (white) closes, CLEAR (red)
         empties the slot, SAVE (green) stores the typed name. tgt.js's savePreset. -->
    <div class="preset-kp-scrim" id="preset-kp" hidden>
      <div class="preset-kp" role="dialog" aria-labelledby="preset-kp-title">
        <div class="preset-kp-title" id="preset-kp-title"></div>
        <input class="preset-kp-input" id="preset-kp-input" type="text" maxlength="60" placeholder="PRESET NAME" autocomplete="off" spellcheck="false">
        <div class="preset-kp-error" id="preset-kp-error"></div>
        <div class="preset-kp-actions">
          <button type="button" class="preset-kp-btn pad-hoverable" id="preset-kp-cancel">CANCEL</button>
          <button type="button" class="preset-kp-btn pad-hoverable clear" id="preset-kp-clear">CLEAR</button>
          <button type="button" class="preset-kp-btn pad-hoverable save" id="preset-kp-save">SAVE</button>
        </div>
      </div>
    </div>

    <!-- PAD cursor (docs/page-cursor.md) — same crosshair/transport MAP uses, driven here only
         while this TGT is the SOI's focused surface. See tgt.js. -->
    <div id="pad-cursor" class="pad-cursor"></div>
  </div>

  <div class="tgt-unavailable mfd-empty" id="tgt-unavailable">
    <span class="mfd-empty-title">TGT</span>&mdash; UNAVAILABLE &mdash;
  </div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script type="module" src="/assets/pages/tgt/tgt.js"></script>
</body>
</html>
