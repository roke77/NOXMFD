<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — TGT</title>
<!--
  Bare TGT page served at /tgt — a fully-clickable replica of the game's in-cockpit
  "TARGET SELECTION" panel (TargetListSelector). Unlike the other frame pages this one is NOT
  bezel-driven: every filter is a clickable component, and the page POSTs the tgt.* commands
  itself (see /assets/services/send-command.js + src/plugin/CommandDispatcher.cs). The only bezel
  key is the shell-owned MAIN back label. See docs/tgt-page.md.

  Shell -> page messages (all {mfd:true, ...}):
    'tgt'         : the whole filter block mirrored from the mod —
                    { present, laser, hud, faction:[{n,on}], category:[{n,on}], vehicle:[{n,on}] }.
                    present:false → the game's TargetListSelector isn't up; show UNAVAILABLE.
    'tgt-targets' : the selected-target list —
                    { items:[{ id, n, g, r, f }] } → the list under the filters.
    'orient'      : app-wide orientation (kept for parity).

  Interaction (touch-friendly, mirrors the game):
    tap a filter        → toggle it (tgt.set {group,index,on})
    long-press a filter → "only this" (tgt.only {group,index}) — isolate it in its group
    RESET FILTER        → tgt.reset   (all filters back on)
    CLEAR TARGETS       → tgt.clear   (deselect every target)
    tap a target's row  → deselect it (target.deselect {id}) — anywhere on the row, no checkbox

  SRC column: SENSOR (live), DATALINK (relayed, still trustworthy), or STALE (relayed, no longer
  trustworthy — the same drift-past-threshold check that pops the "?" on the game's own TGP;
  docs/tgt-stale-lock.md). STALE implies DATALINK.

  DATALINK / STALE buttons (docs/tgt-datalink-cancel.md, docs/tgt-stale-lock.md) — mod-only
  controls, not one of the game's real TargetListSelector filters (those are
  FRIENDLY/ENEMY/category/vehicle/LASER/HUD above):
    tap DATALINK → tgt.clear-datalink (deselect just the datalink-only targets)
    tap STALE    → tgt.clear-stale    (deselect just the stale-locked targets)

  PAD cursor (docs/page-cursor.md) — while this TGT is the SOI's focused surface, the shell forwards
  the same cursor transport MAP uses, plus Cursor Select's live held state
  ({mfd:true, action:'cursor'|'cursor-held'|'cursor-focus'}): held past the long-press threshold
  mirrors a filter cell's own long-press "only" when the cursor's over one, releasing before that
  mirrors the tap instead — filter toggle, tgt.clear-datalink over DATALINK, or tgt.clear-stale over
  STALE. Every other CURSORABLE control (list row, RESET/CLEAR, LASER/HUD, DATALINK, STALE) only
  ever has a tap outcome, since they have no hold behaviour to mirror. Hovering the crosshair over
  any control highlights it (.pad-hoverable/.pad-hover, shared/theme.css) the same way a real mouse
  would. Zoom In/Out (map-act's 'zoom-in'/'zoom-out') are repurposed here to scroll the target list
  instead of zooming (nothing to zoom on this page).

  Next/Previous Target (docs/tgt-cycle-focus.md) steps which locked target is "focused" — a shared,
  server-side id (TargetFocus.cs) reaching TGT/FCR/HSD in every open browser, not a page-local
  concept — and that's the only row-highlight state TGT keeps: the focused row draws an outline,
  amber or grey depending on which control currently owns Cursor Select (see "Select arbitration"
  below). Datalink/Stale keybinds (docs/tgt-keybind-nav.md) are two more map-act actions, TGT-only:
  'tgt-datalink'/'tgt-stale' just fire tgt.clear-datalink/tgt.clear-stale directly — the keybind
  equivalents of tapping the DATALINK/STALE buttons.

  Select arbitration ('tgt-next'/'tgt-prev' actions, docs/tgt-cycle-focus.md): Next/Previous Target
  hides the free crosshair and hands Cursor Select to the focused lock instead (amber outline,
  Select deselects it directly, no aiming needed) — mutually exclusive with the PAD cursor above,
  the same way DATALINK/STALE's own hold-vs-tap arbitration works. Moving the crosshair (an actual
  deflection, not the (0,0) a key release reports) hands Select back to it and un-hides it (grey
  outline on the focused row meanwhile — still focused, but Select won't act on it until
  Next/Previous is pressed again). Gaining SOI focus always starts crosshair-active.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/tgt/tgt.css">
</head>
<body>
  <div class="tgt-panel" id="tgt-panel">
    <div class="tgt-head">
      <span class="tgt-title">TARGET SELECTION</span>
      <span class="tgt-hint">tap&nbsp;=&nbsp;toggle&nbsp;·&nbsp;hold&nbsp;=&nbsp;only</span>
    </div>

    <div class="tgt-top">
      <div class="tgt-actions">
        <button class="tgt-action pad-hoverable reset" data-cmd="reset">RESET<br>FILTER</button>
        <button class="tgt-action pad-hoverable clear" data-cmd="clear">CLEAR<br>TARGETS</button>
      </div>
      <div class="tgt-filters">
        <div class="tgt-row" id="row-faction"></div>
        <div class="tgt-row" id="row-category"></div>
      </div>
      <div class="tgt-modes">
        <button class="tgt-mode pad-hoverable" id="mode-laser" data-mode="laser">LASER</button>
        <button class="tgt-mode pad-hoverable" id="mode-hud"   data-mode="hud">HUD</button>
      </div>
    </div>

    <div class="tgt-vehicles" id="row-vehicle"></div>

    <!-- Selected-target list: NAME / SRC / RNG / GRID per row. The whole row is clickable and
         deselects that target — no checkbox, the row itself already reads as "this is selected".
         .tgt-list-scroll scrolls both axes so a narrow panel (small-screen F-35) overflows instead
         of squeezing columns unreadably thin; .tgt-list-head is sticky within it so the header stays
         put vertically but still tracks the rows horizontally. -->
    <div class="tgt-list" id="tgt-list">
      <div class="tgt-list-scroll">
        <div class="tgt-list-head">
          <span>NAME</span><span>SRC</span><span>RNG</span><span>GRID</span>
        </div>
        <div class="tgt-list-rows" id="tgt-list-rows"></div>
        <div class="tgt-list-empty" id="tgt-list-empty">&mdash; NO TARGETS SELECTED &mdash;</div>
      </div>
    </div>

    <!-- DATALINK / STALE: mod-only, not real TargetListSelector filters — see the header comment above. -->
    <div class="tgt-footer">
      <button class="tgt-datalink-btn pad-hoverable" id="datalink-btn">DATALINK</button>
      <span class="tgt-datalink-desc">Deselect datalink-only</span>
      <button class="tgt-stale-btn pad-hoverable" id="stale-btn">STALE</button>
      <span class="tgt-stale-desc">Deselect stale locks</span>
    </div>

    <!-- PAD cursor (docs/page-cursor.md) — same crosshair/transport MAP uses, driven here only
         while this TGT is the SOI's focused surface. See tgt.js. -->
    <div id="pad-cursor" class="pad-cursor"></div>
  </div>

  <div class="tgt-unavailable mfd-empty" id="tgt-unavailable">
    <span class="mfd-empty-title">TGT</span>&mdash; UNAVAILABLE &mdash;
  </div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script type="module" src="/assets/pages/tgt/tgt.js"></script>
</body>
</html>
