<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — WPT</title>
<!--
  WPT page (issues #38/#73, docs/wpt-rework.md) — route and steer-point manager, served at /wpt. The
  first of the WPT/RTD/SPD family (nav-model.js NAV.wpt): RTD and SPD (/rtd) are the detail pages.

  Navigation points are placed on MAP by long-press and persisted by the plugin's RouteStore. An
  active route receives a waypoint; otherwise the same gesture creates a standalone steer point.
  The left column lists the routes plus one fixed steer-point group; the right pane shows whichever
  is open, and the open route need not be the active one.

  Shell -> page messages (all {mfd:true, ...}): 'mapinfo' : { mission, grid, x, z, hdg, ox, oy, w, h }
  — the slice map.js's own HUD derives, forwarded here (mfd.js forwardWptToFrame/ToPanes) since this
  is a separate document from MAP. Used for the next-point strip, grid labels and the typed-in steer
  point. Also carries the PAD cursor's transport messages (cursor-focus/cursor/cursor-select,
  docs/page-cursor.md) and zoom-in/zoom-out (repurposed here to scroll, same as HUD/TGT).
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/wpt/wpt.css">
</head>
<body>

<div class="wpt-panel" id="wpt-panel">
  <div id="pad-cursor" class="pad-cursor"></div>

  <div class="wpt-head">
    <a class="wpt-back" href="/">&lt; MAP</a>
    <span class="wpt-title">WAYPOINTS</span>
    <span class="wpt-hint">open a route or the steer group &middot; tap a point for its actions</span>
  </div>

  <!-- Next-point strip: one line of guidance; RTD/SPD carry the full readout. The needle is rotated
       in wpt.js (SVG rotate() takes a clean pivot) and hidden when there's nothing to point at. -->
  <div class="wpt-next" id="wpt-next">
    <svg class="wpt-compass" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--no-green-line)" stroke-width="4"/>
      <path d="M 50 3 L 50 16" stroke="var(--no-green)" stroke-width="6"/>
      <g id="wpt-needle" style="display:none"><path d="M 50 14 L 40 66 L 50 54 L 60 66 Z" fill="var(--no-amber)"/></g>
    </svg>
    <span class="wpt-next-kind" id="wpt-next-kind"></span>
    <span class="wpt-next-title" id="wpt-next-title">NO NAVIGATION POINT</span>
    <span class="wpt-next-grid" id="wpt-next-grid"></span>
    <span class="wpt-fill"></span>
    <span class="wpt-next-val"><span class="wpt-k">BRG</span><span id="wpt-next-brg">—</span></span>
    <span class="wpt-next-val"><span class="wpt-k">DIST</span><span id="wpt-next-dist">—</span></span>
    <span class="wpt-next-val"><span class="wpt-k">LEFT</span><span class="wpt-left" id="wpt-next-left">—</span></span>
  </div>

  <div class="wpt-main">
    <!-- Left: route cards (plus incoming shared ones), then the fixed steer-point group. -->
    <div class="wpt-col">
      <div class="wpt-col-head">
        <span class="wpt-col-label">ROUTES</span>
        <span class="wpt-fill"></span>
        <button type="button" class="wpt-btn wpt-btn-go pad-hoverable" id="wpt-new-route">+ NEW</button>
        <button type="button" class="wpt-btn wpt-btn-file pad-hoverable" id="wpt-import-route">IMPORT</button>
        <button type="button" class="wpt-btn wpt-btn-del pad-hoverable" id="wpt-clear-routes">CLEAR</button>
      </div>
      <!-- Inline "new route" name entry (no modal, same idiom as the steer point grid entry). -->
      <div class="wpt-new-row" id="wpt-new-row" hidden>
        <label class="wpt-k" for="wpt-new-name">NAME</label>
        <input type="text" id="wpt-new-name" maxlength="40">
        <button type="button" class="wpt-btn wpt-btn-go pad-hoverable" id="wpt-new-confirm">ADD</button>
        <button type="button" class="wpt-btn pad-hoverable" id="wpt-new-cancel">CANCEL</button>
      </div>
      <div class="wpt-routes" id="wpt-routes"></div>
      <div class="wpt-empty" id="wpt-routes-empty" hidden>no routes &middot; + NEW or IMPORT</div>
      <div class="wpt-divider"></div>
      <button type="button" class="wpt-card wpt-stp-card pad-hoverable" id="wpt-stp-card" aria-pressed="false">
        <span class="wpt-lamp" id="wpt-stp-lamp"></span>
        <span class="wpt-card-body">
          <span class="wpt-card-name wpt-stp-name">STEER POINTS</span>
          <span class="wpt-card-meta" id="wpt-stp-meta"></span>
        </span>
        <span class="wpt-card-tags">
          <svg class="wpt-lock" viewBox="0 0 12 12" aria-label="Fixed group"><rect x="2" y="5.5" width="8" height="5.5"/><path d="M4 5.5 V3.5 A2 2 0 0 1 8 3.5 V5.5"/></svg>
          <span class="wpt-tag wpt-tag-amber" id="wpt-stp-tag"></span>
        </span>
        <span class="wpt-chev">&rsaquo;</span>
      </button>
    </div>

    <!-- Right: the open route or the steer-point group. -->
    <div class="wpt-pane" id="wpt-pane">
      <div class="wpt-pane-head" id="wpt-pane-head">
        <span class="wpt-pane-title" id="wpt-pane-title"></span>
        <span class="wpt-pane-status" id="wpt-pane-status"></span>
      </div>
      <div class="wpt-pane-meta" id="wpt-pane-meta"></div>
      <div class="wpt-actions" id="wpt-pane-actions"></div>

      <!-- Typed-in steer point: a grid square's centre (gridToWorld), the same reference MAP shows. -->
      <div class="wpt-entry" id="wpt-grid-row" hidden>
        <label class="wpt-k" for="wpt-grid-input">GRID</label>
        <input type="text" id="wpt-grid-input" maxlength="4" placeholder="Fd40" autocomplete="off" spellcheck="false">
        <span class="wpt-entry-hint" id="wpt-grid-hint"></span>
        <button type="button" class="wpt-btn wpt-btn-amber pad-hoverable" id="wpt-grid-add">ADD</button>
        <button type="button" class="wpt-btn pad-hoverable" id="wpt-grid-cancel">CANCEL</button>
      </div>

      <!-- Shared import/export panel: IMPORT shows it empty and editable, a route's EXPORT read-only
           and pre-filled with a COPY button instead. -->
      <div class="wpt-io" id="wpt-io" hidden>
        <div class="wpt-k" id="wpt-io-label">IMPORT ROUTE</div>
        <textarea id="wpt-io-text" rows="7" spellcheck="false"></textarea>
        <div class="wpt-io-error" id="wpt-io-error"></div>
        <div class="wpt-actions">
          <button type="button" class="wpt-btn wpt-btn-go pad-hoverable" id="wpt-io-primary">IMPORT</button>
          <button type="button" class="wpt-btn wpt-btn-go pad-hoverable" id="wpt-io-copy">COPY</button>
          <button type="button" class="wpt-btn pad-hoverable" id="wpt-io-close">CLOSE</button>
        </div>
      </div>

      <div class="wpt-table-head">
        <span class="wpt-lampcol"></span>
        <span class="wpt-numcol">#</span>
        <span class="wpt-namecol">NAME</span>
        <span class="wpt-gridcol">GRID</span>
        <span class="wpt-distcol" id="wpt-lastcol">LEG</span>
      </div>
      <div class="wpt-rows" id="wpt-rows"></div>
      <div class="wpt-empty" id="wpt-rows-empty" hidden></div>
    </div>
  </div>
</div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/wpt/wpt-route.js"></script>
<script src="/assets/pages/wpt/waypoints-store.js"></script>
<script type="module" src="/assets/pages/wpt/wpt.js"></script>
</body>
</html>
