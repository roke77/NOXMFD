<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — WPT</title>
<!--
  WPT page (issue #38) — waypoints/route creator, served at /wpt. Sibling of /map under MAP's own
  nav row (nav-model.js's NAV.map/NAV.wpt), not the MAIN-rooted CFG/MD sibling groups.

  Waypoints are placed on the MAP page itself (long-press — map.js) and persisted client-side in
  localStorage (waypoints-store.js). This page is the editor: route list (create/rename/delete/
  switch-active), the active route's waypoint list (rename/delete/reorder), and a distance/bearing
  readout to the next waypoint that auto-advances as the player nears it.

  Shell -> page messages (all {mfd:true, ...}): 'mapinfo' : { mission, grid, x, z, hdg, ox, oy } —
  the same slice map.js's own HUD derives, forwarded here (mfd.js forwardWptToFrame/ToPanes) since
  this is a separate document/iframe from MAP. Used for the readout's distance/bearing calc and for
  labeling waypoints with their grid square. Also carries the PAD cursor's transport messages
  (cursor-focus/cursor/cursor-select, docs/page-cursor.md) and zoom-in/zoom-out (repurposed here to
  scroll the page, same as HUD/TGT) while this page is the SOI's focused surface.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shared/page-chrome.css">
<link rel="stylesheet" href="/assets/pages/wpt/wpt.css">
</head>
<body>

<div class="wpt-panel" id="wpt-panel">
  <!-- Way back to the display when opened standalone; hidden when embedded — same check
       keybinds.js/rates.js use (window.parent !== window). Points at MAP (NAV.wpt), not MAIN. -->
  <a class="wpt-back" href="/">&lt; MAP</a>
  <div class="wpt-title">WAYPOINTS</div>

  <div class="wpt-help">Long-press anywhere on the map to drop a waypoint<br>Click a route to activate/deactivate it<br>&#9998; rename &middot; &#8634; reset &middot; &#8681; export &middot; &#8682; share &middot; &times; delete</div>

  <!-- PAD cursor (docs/page-cursor.md) — position:fixed override in wpt.css, since this is the one
       MFD page whose own body scrolls rather than a fixed-size panel (MAP/TGT/HUD), so a viewport-
       anchored crosshair needs position:fixed, not the shared .pad-cursor's default :absolute. -->
  <div id="pad-cursor" class="pad-cursor"></div>

  <div class="wpt-readout mfd-chip" id="wpt-readout">NO ACTIVE ROUTE</div>

  <!-- Relative-bearing compass to the next waypoint: the needle points where the aircraft's own
       heading needs to turn to. Straight up = "on course" (heading already matches the waypoint's
       bearing); the SVG group is rotated in wpt.js's updateCompass(), not CSS, since SVG's own
       rotate() takes a clean cx/cy pivot without a separate transform-origin dance. The RING always
       shows; only the amber NEEDLE hides (display:none, toggled in wpt.js) whenever there's nothing
       to point at — no active route, route already complete, or no live heading yet. -->
  <div class="wpt-compass" id="wpt-compass">
    <svg viewBox="0 0 100 100" width="100" height="100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--no-green-dim)" stroke-width="1"/>
      <line x1="50" y1="4" x2="50" y2="12" stroke="var(--no-green-dim)" stroke-width="1"/>
      <g id="wpt-compass-needle" style="display:none;">
        <polygon points="50,12 42,58 50,48 58,58" fill="var(--no-amber)"/>
      </g>
    </svg>
  </div>

  <div class="wpt-section">
    <div class="wpt-section-head">
      <span>ROUTES</span>
      <div class="wpt-section-actions">
        <button class="wpt-btn pad-hoverable" id="wpt-new-route">+ NEW ROUTE</button>
        <button class="wpt-btn wpt-btn-ghost pad-hoverable" id="wpt-clear-routes">CLEAR</button>
        <button class="wpt-btn pad-hoverable" id="wpt-import-route">IMPORT</button>
      </div>
    </div>
    <!-- Inline "new route" name entry (no modal — matches keybinds.js/rates.js's no-modal style). -->
    <div class="wpt-new-row" id="wpt-new-row" style="display:none;">
      <input type="text" id="wpt-new-name" placeholder="Route name" maxlength="40">
      <button class="wpt-btn pad-hoverable" id="wpt-new-confirm">ADD</button>
      <button class="wpt-btn wpt-btn-ghost pad-hoverable" id="wpt-new-cancel">CANCEL</button>
    </div>
    <!-- Shared import/export panel — one textarea doing double duty (no modal, same inline-panel
         idiom as wpt-new-row above): IMPORT shows it empty + editable with an IMPORT button; each
         route row's own export button shows it read-only + pre-filled with that route's JSON and a
         COPY button instead. wpt.js's openImportPanel/openExportPanel toggle which. -->
    <div class="wpt-io-row" id="wpt-io-row" style="display:none;">
      <div class="wpt-io-label" id="wpt-io-label">IMPORT ROUTE</div>
      <textarea id="wpt-io-text" rows="8" spellcheck="false"></textarea>
      <div class="wpt-io-error" id="wpt-io-error"></div>
      <div class="wpt-io-actions">
        <button class="wpt-btn pad-hoverable" id="wpt-io-primary">IMPORT</button>
        <button class="wpt-btn pad-hoverable" id="wpt-io-copy">COPY</button>
        <button class="wpt-btn wpt-btn-ghost pad-hoverable" id="wpt-io-close">CLOSE</button>
      </div>
    </div>
    <div class="wpt-routes" id="wpt-routes"></div>
    <div class="wpt-empty" id="wpt-routes-empty">&mdash; NO ROUTES YET &mdash;</div>
  </div>

  <div class="wpt-section">
    <div class="wpt-section-head"><span>ACTIVE ROUTE WAYPOINTS</span></div>
    <div class="wpt-waypoints" id="wpt-waypoints"></div>
    <div class="wpt-empty" id="wpt-waypoints-empty">&mdash; LONG-PRESS THE MAP TO ADD A WAYPOINT &mdash;</div>
  </div>
</div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/wpt/wpt-route.js"></script>
<script src="/assets/pages/wpt/waypoints-store.js"></script>
<script type="module" src="/assets/pages/wpt/wpt.js"></script>
</body>
</html>
