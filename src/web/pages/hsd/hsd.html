<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD - HSD</title>
<!--
  HSD page served at /hsd (docs/rdr-fcr-hsd.md). A 360-degree datalink air picture around
  ownship, using the shell-provided ownship position/heading. Carries the same PAD acquisition
  cursor as FCR (docs/page-cursor.md): Select over a contact toggles its lock, reusing FCR/TGT's
  target set. When opened standalone on localhost for the preview server, hsd.js seeds a tiny demo
  picture so the page is visible without the parent MFD shell.

  Shell -> page messages (all {mfd:true, ...}):
    'hsd': { ownX, ownZ, hdg, metric, radarPresent, radarRange, radarCone,
             items:[{ id, x, z, alt, hdg, tg, rd, dl, n }] }
           x/z are known world positions, hdg is ownship heading, metric selects km vs nm labels.
           radarRange/radarCone describe the FCR coverage wedge to overlay on the HSD range rings.
    action: 'zoom-in'/'zoom-out' step the selected HSD range.
    action: 'cursor'/'cursor-held'/'cursor-focus' drive the shared PAD cursor (services/pad-cursor.js)
            exactly like FCR/TGT/MAP — see hsd.js's cursor wiring.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/hsd/hsd.css">
</head>
<body>
  <div class="hsd-panel">
    <svg class="hsd-scope" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <text x="48" y="44" class="hsd-hdr">HSD</text>
      <text id="hsd-range" x="552" y="44" class="hsd-hdr" text-anchor="end"></text>

      <g id="hsd-grid"></g>
      <g id="hsd-radar"></g>
      <g id="hsd-contacts"></g>
      <g id="hsd-ownship">
        <path d="M300 268 L286 326 L300 316 L314 326 Z" fill="rgba(255,255,255,0.78)"/>
        <line x1="300" y1="248" x2="300" y2="272" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      </g>
      <!-- PAD acquisition gate (docs/page-cursor.md), same two-bar look as FCR's #rdr-cursor-g —
           pad-cursor.js moves the invisible #hsd-cursor div below in panel px; hsd.js converts
           that to viewBox units and paints the visible gate here. -->
      <g id="hsd-cursor-g"></g>

      <text id="hsd-r1" x="48" y="544" class="hsd-read hsd-lock-read"></text>
      <text id="hsd-r2" x="48" y="566" class="hsd-read hsd-lock-read"></text>
      <text id="hsd-link" x="552" y="544" class="hsd-read" text-anchor="end"></text>
      <text id="hsd-locks" x="552" y="566" class="hsd-read" text-anchor="end"></text>
    </svg>
    <div id="hsd-cursor" class="hsd-cursor"></div>
  </div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/hsd/hsd.js"></script>
</body>
</html>
