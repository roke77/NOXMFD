<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — HUD</title>
<!--
  HUD page served at /hud — a clickable replica of the game's in-cockpit "HUD OPTIONS" screen
  (HUDOptions). It controls how unit overlay icons appear on the HUD: a maximized category shows
  its icons at full size, a minimized one shrinks them to a dot (enemy) or hides them (friendly).
  See docs/hud-page.md.

  Unlike the telemetry-pushed pages, this one is fetch-driven, not stream-driven: it POSTs hud.*
  commands (send-command.js → CommandDispatcher) and polls /hud-options (TelemetryServer.
  RefreshHudOptions) every 1.2s to read the current state back — the same loop catches a toggle
  pressed in game instead of here, this page's own writes settling, and a new mission's state.

  Controls (all mirror the in-game screen):
    mode tab (NAV/GUN/A2A/A2G/EW/LOG) → hud.mode {index}  — applies that mode's saved preset
    category MAXIMIZE                 → hud.set {group:'category', index, on}
    vehicle / building type chip      → hud.set {group:'vehicle'|'building', index, on}

  HUD presets (issue #50 follow-up) — 5 fixed numbered slots (HudPresetStore), server-side so any
  browser or the KEY page's own 5 recall keybinds can save/load one:
    SAVE → opens LayoutModal.prompt for a name, then preset.save {wname} (always the CURRENT slot)
    LOAD → opens LayoutModal.pickList over GET /hud-presets; picking an item applies it and makes
           it current, the row's pencil/× send preset.rename/preset.delete {index, ...}
  The bottom label's current index/name rides this page's existing /hud-options poll (a `preset`
  field), not a separate endpoint.

  The seven category NAMES are the page's own, by index — the game exposes no per-category display
  name (see docs/hud-page.md). Vehicle/building names come from /hud-options (the Encyclopedia).

  PAD cursor (docs/page-cursor.md) — while this HUD is the SOI's focused surface, the shell forwards
  the same cursor/cursor-select transport MAP uses ({mfd:true, action:'cursor'|'cursor-select'|
  'cursor-focus'}). Zoom In/Out (map-act's 'zoom-in'/'zoom-out') are repurposed here to scroll the
  panel instead of zooming (nothing to zoom on this page). #pad-cursor sits OUTSIDE .hud-panel
  (which scrolls its own content) so the crosshair never drifts with a scroll — see hud.js.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shell/layout-modal.css">
<link rel="stylesheet" href="/assets/pages/hud/hud.css">
</head>
<body>

<div class="hud-panel" id="hud-panel">
  <!-- declutter strip + mode tabs + category rows are built by hud.js from /hud-options -->
  <!-- native-HUD declutter toggles (the mod's own HudDeclutter flags): weapon panel / minimap / boxes -->
  <div class="hud-declutter" id="hud-declutter"></div>
  <!-- HUD presets (issue #50 follow-up): current slot label + SAVE/LOAD, built by hud.js. Sits
       right below the declutter strip's own separator, above the mode tabs. -->
  <div class="hud-preset-bar" id="hud-preset-bar">
    <span class="hud-preset-label" id="hud-preset-label"></span>
    <button type="button" class="hud-preset-btn pad-hoverable" id="hud-preset-save">SAVE</button>
    <button type="button" class="hud-preset-btn pad-hoverable" id="hud-preset-load">LOAD</button>
  </div>
  <div class="hud-modes" id="hud-modes"></div>
  <div class="hud-cats" id="hud-cats"></div>
  <!-- shown when /hud-options is empty (no mission / HUDOptions not up) -->
  <div class="hud-empty mfd-empty" id="hud-empty"><span class="mfd-empty-title">HUD</span>&mdash; UNAVAILABLE &mdash;</div>
</div>
<div id="pad-cursor" class="pad-cursor"></div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/shell/layout-modal.js"></script>
<script type="module" src="/assets/pages/hud/hud.js"></script>
</body>
</html>
