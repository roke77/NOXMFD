<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — TD</title>
<!--
  Target Designator page (issue #47, docs/target-designator.md), served at /td. Squad leader only:
  reached from TGT's own nav row (nav-model.js's NAV.tgt, appended at runtime by td-nav.js only
  while leading a squad — see its own header comment), not MAIN. Members never come here — a
  designation reaches them as the dock on their own TGT page (tgt.js).

  An assignment matrix: one row per target on the leader's TGT list, one column per squad slot
  (1 = the leader's own marker, never sent). Every control acts on what it names, with no selection
  step: a cell gives that target to that slot (or takes it back), a target's name gives it to every
  slot, and a column head gives every target to that slot — row and column fill the gaps, or empty
  when already full (td-matrix.js). Each column head shows how many targets that slot has and
  whether its list is SENT, CHANGED since the last send, or UNSENT. DESIGNATE sends every waiting
  list over the squad transport, replacing what each member had, then returns to TGT.

  The table is deliberately static: it only redraws its rows on a real select/deselect in-game, a
  Metric/Imperial flip, a roster change, or REFRESH (td.js) — a live-updating table fights with
  clicking it (see target-designator.md). Rows stretch to fill the panel and scroll past the point
  where they'd drop below a comfortable tap height.

  All state round-trips through the plugin: GET /squad (role/roster, same as SQD) and GET /td-state
  (assignments + what each slot was last sent — TdStore.cs) once on load, then the shell's
  SSE-relayed 'sqd-state'/'td-state-push'. POST /command: td.cell / td.row / td.column / td.clear /
  td.designate.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/td/td.css">
</head>
<body>

<div class="td-panel" id="td-panel">
  <div class="td-head">
    <a class="td-back" href="/tgt">&lt; TGT</a>
    <span class="td-title">TARGET DESIGNATOR</span>
    <span class="td-summary" id="td-summary"></span>
  </div>

  <!-- PAD cursor (docs/page-cursor.md) — same fixed-position crosshair SQD/WPT use. -->
  <div id="pad-cursor" class="pad-cursor"></div>

  <div class="td-unavailable" id="td-unavailable" style="display:none;"></div>

  <div class="td-section" id="td-leader-section" style="display:none;">
    <!-- The column heads live inside the scroller as a sticky row, so they always line up with the
         cells whatever width the scrollbar takes. -->
    <div class="td-list" id="td-list">
      <div class="td-grid-row td-matrix-head" id="td-matrix-head">
        <span class="td-head-label"><span>TARGET · TAP FOR ALL SLOTS</span><span>RNG</span></span>
      </div>
      <div class="td-rows" id="td-rows"></div>
      <div class="td-empty" id="td-empty">&mdash; NO TARGETS SELECTED &mdash;</div>
    </div>

    <span class="td-flash" id="td-flash"></span>

    <div class="td-actions">
      <button class="td-btn td-designate-btn pad-hoverable" id="td-designate"><span class="td-designate-t">DESIGNATE</span><span class="td-designate-sub" id="td-designate-sub"></span></button>
      <button class="td-btn td-btn-ghost pad-hoverable" id="td-refresh">REFRESH</button>
      <button class="td-btn td-btn-ghost pad-hoverable" id="td-clear">CLEAR</button>
    </div>
  </div>
</div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script type="module" src="/assets/pages/td/td.js"></script>
</body>
</html>
