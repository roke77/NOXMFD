  890px-glass coordinates, scaled to the pane by its viewBox.
-->

  <svg id="hsi-svg" class="hsi-svg" viewBox="56 14 778 862" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Horizontal situation indicator"></svg>
</div>
<script src="/assets/pages/wpt/wpt-route.js"></script>
<script src="/assets/pages/wpt/waypoints-store.js"></script>
