<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — KEYBINDS</title>
<!--
  Extended-keybinds page served at /keybinds — a standalone page (like /f35, not an MFD split
  pane) for binding the mod's extra cockpit functions: things the game has no native keybind
  for (dedicated gear up/down, direct countermeasures, ...). See docs/keybinds-page.md.

  Fetch-driven like /hud: polls /keybinds-config (the plugin's bind registry) and POSTs
  keybind.* commands (send-command.js → CommandDispatcher). Layout: a header, a section rail
  (search + group/section links) and one scrolling column — SETTINGS tiles first, then the
  binds grouped into numbered flight-order groups. All of it is built by keybinds.js.

  Capture is split by source:
    keyboard — captured HERE (focus is on the browser, the game never sees the key): click the
               cell, press a key; its KeyboardEvent.code maps to a Unity KeyCode name which is
               POSTed via keybind.set-key. Esc cancels. Mouse buttons are not capturable (a
               click is how you drive this page).
    joystick — captured by the PLUGIN (only Rewired's button numbering matches playback):
               clicking the cell POSTs keybind.arm-joy; the next stick button pressed lands in
               the bind and comes back through the /keybinds-config poll.
    axis     — a few cursor rows only (docs/map-cursor.md), same plugin-side capture as
               joystick but for a continuous HOTAS axis (keybind.arm-axis) — the row shows the
               axis cell in the joystick column with an invert toggle alongside.
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/shared/page-chrome.css">
<link rel="stylesheet" href="/assets/shared/lit-panel.css">
<link rel="stylesheet" href="/assets/pages/keybinds/keybinds.css">
</head>
<body>

<div class="kb-panel" id="kb-panel">
  <header class="kb-top">
    <!-- Way back to the display, for when this page is opened standalone (typed /keybinds, bookmarked).
         Removed when embedded in a shell (classic #page-frame or an F-35 portal), where the shell's own
         MAIN key is the way back — see keybinds.js. '/' rather than a remembered shell: the
         sticky-layout head guard there redirects to whichever one is current. -->
    <div class="kb-top-side"><a class="kb-back" href="/">&lt; MAIN</a></div>
    <div class="kb-title">EXTENDED KEYBINDS</div>
    <div class="kb-top-side kb-count" id="kb-count"></div>
  </header>

  <div class="kb-body">
    <nav class="kb-rail" id="kb-rail" aria-label="Sections">
      <button class="kb-rail-toggle" id="kb-rail-toggle" aria-controls="kb-rail" aria-expanded="true" title="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
      </button>
      <div id="kb-rail-links"><!-- built by keybinds.js --></div>
    </nav>

    <div class="kb-content">
    <!-- Fixed above the scrolling column: it filters the binds below, not the rail. -->
    <div class="kb-find">
      <label class="kb-sr" for="kb-find">Find a function</label>
      <input id="kb-find" type="search" placeholder="FIND FUNCTION OR KEY" autocomplete="off" spellcheck="false">
    </div>
    <main class="kb-main" id="kb-main">
      <!-- Plain on/off settings, not binds — no key/joy/axis source of their own, so they're
           tiles above the tables. Built by keybinds.js from /keybinds-config. -->
      <section id="kb-settings"></section>
      <div id="kb-rows"><!-- built by keybinds.js from /keybinds-config --></div>
      <div class="kb-none" id="kb-none">NO MATCHING FUNCTION</div>
    </main>
    </div>
  </div>

  <!-- shown while /keybinds-config is unreachable (plugin not running) -->
  <div class="mfd-empty" id="kb-empty"><span class="mfd-empty-title">KEYBINDS</span>&mdash; UNAVAILABLE &mdash;</div>
</div>

<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/pages/keybinds/keybinds.js"></script>
</body>
</html>
