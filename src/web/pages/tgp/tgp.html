<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NO XMFD — TGP</title>
<!--
  Bare TGP page served at /tgp. Single source of truth for the targeting-pod feed in BOTH
  layouts (full-screen iframe + split pane) — a pure reactive renderer fed by the shell over
  postMessage. The full-view overlay twin in MfdPage.cs is gone. No 'full' profile is needed:
  the centred 3:2 feed renders identically at any container size (like MAP).

  Shell -> page messages (all {mfd:true, ...}):
    'tgp'    : { active, resolution, quality, data } — active: whether a target is locked (mirrored from the
               map iframe's SSE). Toggles .has-feed, swapping the live MJPEG for the NO LOCK
               placeholder. resolution is native|mid|high; quality is the temporary native|hq
               compatibility alias. data: the stat
               overlay block (TelemetryJson.cs's TgpBlock, including data.boxes — one screen-
               projected lock box per locked target) or null when there's no lock. Both the
               locked-target case (data.cnt > 0) and manual mode (data.manual,
               docs/tgp-manual-control.md's "In-cockpit overlay" / web parity — same corner-group
               layout, different field mapping via tgp.js's applyManualOverlay) only draw
               client-side at either mirror resolution: Native's captured video already has this baked in for
               free either way, since Native captures the game's own stacked-camera UICam output
               directly and TgpNativeOverlay populates those exact same TargetScreenUI fields
               (and its own crosshair) for manual mode too. Drawing it client-side in Native as
               well double-shows everything — text baked into the pixels AND drawn again as HTML
               on top. manual:
               TgpManualControl.ManualMode — shows the crosshair when a feed is present AND
               resolution is MID/HIGH (.show-overlay, gated the same way as the stat block above); the
               Point Track box additionally needs data.pointTrack (tgp.js toggles
               .tgp-point-track from inside applyOverlay, since that's only known once 'data'
               arrives, not from the top-level flag alone).
    'orient' : app-wide orientation (kept for parity).
  The MJPEG <img> connects to /tgp.mjpg directly; the server only emits frames while a target
  is locked, so it stays hidden (NO LOCK shown) until 'tgp' active flips true.

  On-screen joystick (#tgp-joystick, tgp.js's own pointerdown/move/up handlers, no shell message
  involved): a mouse/touch-only pan/tilt control for the manual camera, since HOTAS pan/tilt has
  no on-screen equivalent otherwise. Sends the SAME cursor.set { x, y } command
  remote-keybinds.js already sends for a remote-mapped physical key — Keybinds.Poll() merges it
  into the PAD cursor vector and feeds TgpManualControl.SetPan unchanged
  (docs/tgp-manual-control.md), so no plugin-side change was needed for this. Dimmed and inert
  via .tgp-manual (outside manual mode SetPan is a no-op anyway — TgpManualControl.Tick() returns
  immediately whenever ManualMode is off — but a live-looking control that does nothing would be
  confusing).
-->
<link rel="stylesheet" href="/assets/shared/font.css">
<link rel="stylesheet" href="/assets/shared/theme.css">
<link rel="stylesheet" href="/assets/pages/tgp/tgp.css">
</head>
<body>
  <div class="tgp-panel" id="tgp-panel">
    <div class="tgp-empty mfd-empty"><span class="mfd-empty-title">TGP</span>&mdash; NO LOCK &mdash;</div>
    <img class="tgp-img" id="tgp-img" alt="">
    <div class="tgp-crosshair" id="tgp-crosshair">
      <span class="tgp-ch-arm tgp-ch-top"></span>
      <span class="tgp-ch-arm tgp-ch-bottom"></span>
      <span class="tgp-ch-arm tgp-ch-left"></span>
      <span class="tgp-ch-arm tgp-ch-right"></span>
      <div class="tgp-ch-box" id="tgp-ch-box">
        <span class="tgp-ch-box-edge tgp-ch-box-top"></span>
        <span class="tgp-ch-box-edge tgp-ch-box-bottom"></span>
        <span class="tgp-ch-box-edge tgp-ch-box-left"></span>
        <span class="tgp-ch-box-edge tgp-ch-box-right"></span>
      </div>
    </div>
    <div class="tgp-overlay" id="tgp-overlay">
      <div class="tgp-ov-stack tgp-ov-tl">
        <div class="tgp-ov-title" id="tgp-ov-type"></div>
        <div class="tgp-ov-pilot" id="tgp-ov-pilot"></div>
        <div class="tgp-ov-stat" id="tgp-ov-rng"></div>
        <div class="tgp-ov-stat" id="tgp-ov-alt"></div>
        <div class="tgp-ov-stat" id="tgp-ov-spd"></div>
      </div>
      <div class="tgp-ov-stack tgp-ov-tr">
        <div class="tgp-ov-stat" id="tgp-ov-hdg"></div>
        <div class="tgp-ov-stat" id="tgp-ov-relalt"></div>
        <div class="tgp-ov-stat" id="tgp-ov-relspd"></div>
      </div>
      <div class="tgp-ov-bl">
        <div class="tgp-ov-compass" id="tgp-ov-compass">
          <div class="tgp-ov-needle" id="tgp-ov-needle"></div>
        </div>
        <div class="tgp-ov-brg" id="tgp-ov-bearing"></div>
      </div>
      <div class="tgp-ov-stack tgp-ov-br">
        <div class="tgp-ov-stat" id="tgp-ov-grid"></div>
        <div class="tgp-ov-stat" id="tgp-ov-mode"></div>
        <div class="tgp-ov-stat" id="tgp-ov-mag"></div>
      </div>
      <div id="tgp-ov-boxes"></div>
    </div>
    <div class="tgp-joystick" id="tgp-joystick">
      <div class="tgp-joystick-knob" id="tgp-joystick-knob"></div>
    </div>
  </div>
<script src="/assets/pages/keybinds/keybinds-keymap.js"></script>
<script src="/assets/services/remote-keybinds.js"></script>
<script src="/assets/services/send-command.js"></script>
<script src="/assets/pages/tgp/tgp.js"></script>
</body>
</html>
